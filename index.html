function guessPeriode(y,m,d) {
  const n = y*10000 + m*100 + d;
  const titles = [], tags = new Set();
  PERIODES.forEach(([a,b,t,tg]) => {
    if (n >= a && n <= b) { titles.push(t); tg.forEach(x => tags.add(x)); }
  });
  if (titles.length === 0) return null;
  return { title: titles.join(" · "), tags: Array.from(tags) };
}

function bearer() {
  return (session && session.access_token) ? session.access_token : SUPABASE_KEY;
}

async function rest(path, opts = {}, retry = true) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + bearer(),
      "Content-Type": "application/json"
    }, opts.headers || {}),
    body: opts.body
  });
  if (res.status === 401 && retry && session && session.refresh_token) {
    if (await refreshSession()) return rest(path, opts, false);
  }
  if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0,200));
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function signIn(email, password) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  });
  if (!res.ok) return false;
  const d = await res.json();
  session = { access_token: d.access_token, refresh_token: d.refresh_token, email: (d.user && d.user.email) || email };
  window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  isAdmin = true;
  return true;
}

async function refreshSession() {
  if (!session || !session.refresh_token) return false;
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  if (!res.ok) { signOut(); return false; }
  const d = await res.json();
  session = { access_token: d.access_token, refresh_token: d.refresh_token, email: session.email };
  window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  isAdmin = true;
  return true;
}

function signOut() {
  session = null; isAdmin = false;
  window.localStorage.removeItem(SESSION_KEY);
}

function restoreSession() {
  try {

async function loadEntries() {
  restoreSession();
  activeCollectionId = "__all";
  try {
    const cols = await rest("collections?select=*&order=ordre.asc");
    const rows = await rest("journaux?select=*&limit=10000");
    cloudOk = true;
    baseRemplie = !!(rows && rows.length);
    if (baseRemplie) {
      entries = rows.map(fromRow);
      collections = (cols && cols.length)
        ? cols.map(c => ({ id: c.id, name: c.name, prix: c.prix, gallica: c.gallica }))
        : DEFAULT_COLLECTIONS.slice();
      localSave();
      return;
    }
    // base vide : on prépare les données mais on n'écrit rien sans connexion
    entries = seedEntries();
    collections = DEFAULT_COLLECTIONS.slice();
    return;
  } catch (e) {
    cloudOk = false;
  }
  // hors ligne : on retombe sur la copie locale
  try {
    const rawC = window.localStorage.getItem(COLLECTIONS_KEY);
    const rawE = window.localStorage.getItem(STORAGE_KEY);
    if (rawE) {
      entries = JSON.parse(rawE);
      collections = rawC ? JSON.parse(rawC) : DEFAULT_COLLECTIONS.slice();
      entries.forEach(e => {
        if (!e.collectionId) e.collectionId = "default";
        if (!Array.isArray(e.tags)) e.tags = [];
        if (typeof e.title !== "string") e.title = "";
        if (typeof e.note !== "string") e.note = "";
      });
      return;
    }
  } catch (e) { /* rien en local non plus */ }
  entries = seedEntries();
  collections = DEFAULT_COLLECTIONS.slice();
  localSave();
}

function normalize(s) {
  return (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function formatDate(e) {
  return `${e.day} ${MOIS[e.month-1]} <span class="jr-row-year">${e.year}</span>`;
}

function daysLeft(reservedUntil) {
  return Math.ceil((reservedUntil - Date.now()) / 86400000);
}

function checkExpiredReservations() {
  return entries.filter(e => e.status === "r" && e.reservedUntil && e.reservedUntil < Date.now());
}

function parseSearch(q) {
  q = q.trim();
  if (!q) return null;
  let m = q.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let year = parseInt(m[3], 10);
    if (year < 100) year += 1900;
    return { day: parseInt(m[1],10), month: parseInt(m[2],10), year };
  }
  m = q.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return { day: parseInt(m[1],10), month: parseInt(m[2],10) };
  const monthIdx = MOIS.findIndex(mo => normalize(mo) === normalize(q));
  if (monthIdx >= 0) return { month: monthIdx + 1 };
  m = q.match(/^(19\d{2})$/);
  if (m) return { year: parseInt(m[1],10) };
  return { text: normalize(q) };
}

function matchesSearch(e, parsed) {
  if (!parsed) return true;
  if (parsed.text) {
    return (e.tags || []).some(t => normalize(libelleTag(t)).includes(parsed.text))
      || normalize(e.title).includes(parsed.text)
      || normalize(e.note).includes(parsed.text)
      || normalize(STATUS_LABEL[e.status]).includes(parsed.text);
  }
  if (parsed.day && e.day !== parsed.day) return false;
  if (parsed.month && e.month !== parsed.month) return false;
  if (parsed.year && e.year !== parsed.year) return false;
  return true;
}

}

function renderAlerts() {
  const expired = checkExpiredReservations();
  const zone = document.getElementById("jrAlertZone");
  if (expired.length === 0) { zone.innerHTML = ""; return; }
  const colName = id => (collections.find(c => c.id === id) || {}).name || "";
  zone.innerHTML = `<div class="jr-alert">
    <h3>${expired.length} réservation${expired.length > 1 ? "s" : ""} arrivée${expired.length > 1 ? "s" : ""} à échéance</h3>
    ${expired.map(e => `
      <div class="jr-alert-row">
        <span>${e.day} ${MOIS[e.month-1]} ${e.year}${collections.length > 1 ? ' · ' + colName(e.collectionId) : ''}</span>
        <span class="jr-alert-btns">
          <button data-action="extend" data-id="${e.id}">Prolonger ${RESERVE_DAYS}j</button>
          <button data-action="release" data-id="${e.id}">Remettre dispo</button>
        </span>
      </div>`).join("")}
  </div>`;
  zone.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.id);
      if (!entry) return;
      if (btn.dataset.action === "extend") {
        entry.reservedUntil = Date.now() + RESERVE_DAYS * 86400000;
      } else {
        setStatut(entry, entry.statutAvant || "d");
      }
      await persistEntry(entry);
      render();
    });
  });
}

function inCollection(e) {
  return activeCollectionId === "__all" || e.collectionId === activeCollectionId;
}

function renderList() {
  const parsed = parseSearch(searchQuery);
  let filtered = entries.filter(e =>
    inCollection(e)
    && (activeFilters.size === 0 || activeFilters.has(e.status))
    && (selectedTags.size === 0 || (e.tags||[]).some(t => selectedTags.has(t)))
    && matchesSearch(e, parsed)
  );
  filtered.sort((a,b) => a.year - b.year || a.month - b.month || a.day - b.day);

  document.getElementById("jrCount").textContent = `${filtered.length} date${filtered.length !== 1 ? "s" : ""}`;

  if (filtered.length === 0) {
    document.getElementById("jrList").innerHTML = `<div class="jr-empty">Aucun journal ne correspond à cette recherche.</div>`;
    return;
  }

  document.getElementById("jrList").innerHTML = filtered.map(e => {
    let sub = e.title || "";
    let cls = e.guessed && e.title ? "jr-row-tag jr-guessed" : "jr-row-tag";
    if (e.guessed && e.title) sub = "≈ " + sub;
    if (e.status === "r") {
      const info = e.reservedUntil
        ? (daysLeft(e.reservedUntil) > 0 ? `expire dans ${daysLeft(e.reservedUntil)}j` : "réservation expirée")
        : "réservation sans limite";
      sub = info + (e.title ? " · " + e.title : "");
      cls = "jr-row-tag";
    }
    const cc = collCouleur(e.collectionId);
    const colTag = activeCollectionId === "__all"
      ? `<span class="jr-colchip" style="background:${cc.bg};color:${cc.fg}">${escapeHtml(collName(e.collectionId))}</span>` : "";
    const tags = e.tags || [];
    const tagsTries = tags.slice().sort((a,b) => (estMaster(b)?1:0) - (estMaster(a)?1:0));
    const tagsHtml = tagsTries.length
      ? `<span class="jr-rowtags">${tagsTries.slice(0,4).map(t => `<span class="jr-rowtag ${estMaster(t)?"jr-rowtag-master":""}">${escapeHtml(libelleTag(t))}</span>`).join("")}${tagsTries.length > 4 ? `<span class="jr-rowtag jr-rowtag-plus">+${tagsTries.length-4}</span>` : ""}</span>`
      : "";
    const ligne = `<div class="jr-row" data-id="${e.id}">
      ${statusEditId === e.id ? `
        <div class="jr-row-top">
          <div class="jr-row-date">${formatDate(e)}</div>
          <div class="jr-statuspick">
            <button class="jr-badge jr-badge-d ${e.status==='d'?'cur':''}" data-set="d" data-eid="${e.id}">Disponible</button>
            <button class="jr-badge jr-badge-s ${e.status==='s'?'cur':''}" data-set="s" data-eid="${e.id}">Spécial</button>
            <button class="jr-badge jr-badge-v ${e.status==='v'?'cur':''}" data-set="v" data-eid="${e.id}">Vendu</button>
            <button class="jr-badge jr-badge-r ${e.status==='r'&&e.reservedUntil?'cur':''}" data-set="r" data-eid="${e.id}">Réservé ${RESERVE_DAYS}j</button>
            <button class="jr-badge jr-badge-r ${e.status==='r'&&!e.reservedUntil?'cur':''}" data-set="r" data-perm="1" data-eid="${e.id}">Réservé sans limite</button>
          </div>
          <button class="jr-pickcancel" data-cancelstatus="1">✕</button>
        </div>
      ` : `
      <div class="jr-row-top">
        <div class="jr-row-open jr-row-datewrap" data-open="${e.id}">
          <span class="jr-row-date">${formatDate(e)}</span>
        </div>
        ${isAdmin
          ? `<button class="jr-badge jr-badge-${e.status} jr-badge-btn" data-status="${e.id}">${STATUS_LABEL[e.status]}</button>`
          : `<span class="jr-badge jr-badge-${e.status}">${STATUS_LABEL[e.status]}</span>`}
      </div>
      ${(colTag || sub || tagsHtml) ? `<div class="jr-row-open jr-row-bas" data-open="${e.id}">
        ${colTag}
        ${sub ? `<span class="${cls}">${escapeHtml(sub)}</span>` : ""}
        ${tagsHtml}
      </div>` : `<span class="jr-row-bas"></span>`}
      <div class="jr-row-act">
        ${isAdmin || (e.status !== "d" && e.status !== "s") ? "" :
          `<button class="jr-add-panier ${dansPanier(e.id) ? "on" : ""}" data-panier="${e.id}" aria-label="Ajouter à ma sélection">${dansPanier(e.id) ? "✓" : "+"}</button>`}
      </div>
      `}
    </div>`;
    return detailId === e.id ? ficheHtml(e) : ligne;
  }).join("");

  document.querySelectorAll(".jr-row-open").forEach(el => {
    el.addEventListener("click", () => { pendingDeleteId = null; statusEditId = null; ouvrirFiche(el.dataset.open); });
  });

  document.querySelectorAll(".jr-badge-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      statusEditId = btn.dataset.status;
      pendingDeleteId = null;
      renderList();
    });
  });
  document.querySelectorAll("[data-cancelstatus]").forEach(btn => {
    btn.addEventListener("click", () => { statusEditId = null; renderList(); });
  });
  document.querySelectorAll("[data-set]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.eid);
      if (!entry) return;
      setStatut(entry, btn.dataset.set, !!btn.dataset.perm);
      statusEditId = null;
      await persistEntry(entry);
      render();
    });
  });
  document.querySelectorAll("[data-panier]").forEach(btn => {
    btn.addEventListener("click", () => {
      basculerPanier(btn.dataset.panier);
      renderPanier();
      renderView();
    });
  });
  document.querySelectorAll(".jr-del-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      pendingDeleteId = btn.dataset.id;
      renderList();
    });
  });
  document.querySelectorAll(".jr-confirm-no").forEach(btn => {
    btn.addEventListener("click", () => { pendingDeleteId = null; renderList(); });
  });
  document.querySelectorAll(".jr-confirm-yes").forEach(btn => {
    btn.addEventListener("click", async () => {
      const delId = btn.dataset.yes;
      entries = entries.filter(x => x.id !== delId);
      pendingDeleteId = null;
      if (detailId === delId) detailId = null;
      await persistDelete(delId);
      render();
    });
  });
}

function prixAffiche(e, col) {
  if (e.status === "v") return "";
  if (col.prix == null) return "";
  if (e.status === "s") return "À partir de " + col.prix + " € — me contacter";
  return col.prix + " €";
}

function currentFiltered() {
  const parsed = parseSearch(searchQuery);
  return entries.filter(e =>
    inCollection(e)
    && (activeFilters.size === 0 || activeFilters.has(e.status))
    && (selectedTags.size === 0 || (e.tags||[]).some(t => selectedTags.has(t)))
    && matchesSearch(e, parsed)
  );
}

function renderView() {
  document.querySelectorAll(".jr-vbtn").forEach(b => {
    const admin = b.dataset.view === "stats";
    b.className = "jr-vbtn" + (admin ? " jr-vbtn-admin" : "") + (b.dataset.view === viewMode ? " on" : "");
    b.style.display = admin && !isAdmin ? "none" : "inline-block";
    b.onclick = () => { viewMode = b.dataset.view; detailId = null; render(); };
  });
  document.getElementById("jrShare").onclick = copierLien;

  const liste = document.getElementById("jrList");
  const cal = document.getElementById("jrCalendar");
  if (!isAdmin && viewMode === "stats") viewMode = "liste";

  if (viewMode === "stats") {
    liste.innerHTML = "";
    renderStatsPanel();
  } else if (viewMode === "calendrier") {
    liste.innerHTML = "";
    renderCalendrier();
  } else {
    cal.innerHTML = "";
    renderList();
  }
}

function renderCalendrier() {
  const zone = document.getElementById("jrCalendar");
  const filtered = currentFiltered();
  document.getElementById("jrCount").textContent =
    `${filtered.length} date${filtered.length !== 1 ? "s" : ""}`;

  if (filtered.length === 0) {
    zone.innerHTML = `<div class="jr-empty">Aucun journal ne correspond à cette recherche.</div>`;
    return;
  }

  // index : "annee-mois-jour" -> liste d'entrées (une date peut exister dans plusieurs collections)
  const index = {};
  filtered.forEach(e => {
    const k = e.year + "-" + e.month + "-" + e.day;
    (index[k] = index[k] || []).push(e);
  });
  const PRIORITE = { d: 4, s: 3, r: 2, v: 1 };
  const annees = [...new Set(filtered.map(e => e.year))].sort((a,b) => a-b);

  zone.innerHTML = annees.map(an => {
    const mois = [];
    for (let m = 1; m <= 12; m++) {
      const nbJours = new Date(an, m, 0).getDate();
      // 0 = lundi
      const premier = (new Date(an, m-1, 1).getDay() + 6) % 7;
      const cellules = [];
      for (let i = 0; i < premier; i++) cellules.push(`<span class="jr-cal-vide"></span>`);
      let aDuStock = false;
      for (let j = 1; j <= nbJours; j++) {
        const liste = index[an + "-" + m + "-" + j];
        if (liste && liste.length) {
          aDuStock = true;
          const best = liste.slice().sort((a,b) => PRIORITE[b.status] - PRIORITE[a.status])[0];
          const multi = liste.length > 1;
          const infobulle = liste.map(x => collName(x.collectionId) + (x.title ? " — " + x.title : "")).join(" / ");
          const ouvert = liste.some(x => x.id === detailId);
          cellules.push(`<button class="jr-cal-jour jr-cal-${best.status}${multi ? " jr-cal-multi" : ""}${ouvert ? " jr-cal-sel" : ""}" data-cal="${best.id}" data-multi="${multi ? liste.length : ""}" data-date="${j}/${m}/${an}" title="${escapeHtml(infobulle)}">${j}</button>`);
        } else {
          cellules.push(`<span class="jr-cal-jour jr-cal-off">${j}</span>`);
        }
      }
      if (!aDuStock) continue;
      mois.push(`<div class="jr-cal-mois">
        <div class="jr-cal-nom">${MOIS[m-1]}</div>
        <div class="jr-cal-entetes"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="jr-cal-grille">${cellules.join("")}</div>
      </div>`);
      const sel = entries.find(x => x.id === detailId);
      if (sel && sel.year === an && sel.month === m) {
        mois.push(`<div class="jr-cal-fiche">${ficheHtml(sel)}</div>`);
      }
    }
    return `<div class="jr-cal-annee"><h2>${an}</h2><div class="jr-cal-mois-wrap">${mois.join("")}</div></div>`;
  }).join("");

  zone.querySelectorAll("[data-cal]").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.multi) {
        // plusieurs journaux à cette date : on bascule en liste filtrée sur la date exacte
        searchQuery = b.dataset.date;
        const inp = document.getElementById("jrSearch");
        if (inp) inp.value = searchQuery;
        viewMode = "liste";
        detailId = null;
        render();
      } else {
        ouvrirFiche(b.dataset.cal);
      }
    });
  });
}

function copierLien() {
  const p = new URLSearchParams();
  if (searchQuery.trim()) p.set("q", searchQuery.trim());
  if (selectedTags.size) p.set("tags", [...selectedTags].join(","));
  if (activeCollectionId !== "__all") p.set("col", activeCollectionId);
  if (viewMode !== "liste") p.set("vue", viewMode);
  const url = location.origin + location.pathname + (p.toString() ? "?" + p.toString() : "");
  const btn = document.getElementById("jrShare");
  navigator.clipboard.writeText(url).then(
    () => { btn.textContent = "✓ Lien copié"; setTimeout(() => btn.textContent = "Copier le lien", 2000); },
    () => { btn.textContent = "Copie impossible"; setTimeout(() => btn.textContent = "Copier le lien", 2000); }
  );
}

function lireLien() {
  const p = new URLSearchParams(location.search);
  if (p.get("q")) {
    searchQuery = p.get("q");
    const inp = document.getElementById("jrSearch");
    if (inp) inp.value = searchQuery;
  }
  if (p.get("tags")) p.get("tags").split(",").filter(Boolean).forEach(t => selectedTags.add(t));
  if (p.get("col")) activeCollectionId = p.get("col");
  if (p.get("vue") === "calendrier") viewMode = "calendrier";
}

// ---------- Liste de courses (côté visiteur, stockée dans son navigateur) ----------
const PANIER_KEY = "mja-panier";
let panier = [];
let panierOuvert = false;

function chargerPanier() {
  try {
    const raw = window.localStorage.getItem(PANIER_KEY);
    panier = raw ? JSON.parse(raw) : [];
  } catch (e) { panier = []; }
  // on nettoie les références disparues
  panier = panier.filter(id => entries.some(e => e.id === id));
}

function sauverPanier() {
  try { window.localStorage.setItem(PANIER_KEY, JSON.stringify(panier)); } catch (e) {}
}

function dansPanier(id) { return panier.indexOf(id) !== -1; }

function basculerPanier(id) {
  const i = panier.indexOf(id);
  if (i === -1) panier.push(id); else panier.splice(i, 1);
  sauverPanier();
}

function texteCommande() {
  const items = panier.map(id => entries.find(e => e.id === id)).filter(Boolean);
  items.sort((a,b) => a.year - b.year || a.month - b.month || a.day - b.day);
  const lignes = items.map(e =>
    `• ${e.day} ${MOIS[e.month-1]} ${e.year} — ${collName(e.collectionId)}`
  );
  return `Ma sélection — ${items.length} ${items.length > 1 ? "journaux" : "journal"}\n` + lignes.join("\n");
}

function renderPanier() {
  const bar = document.getElementById("jrPanierBar");
  if (!bar) return;
  if (panier.length === 0) { bar.innerHTML = ""; bar.style.display = "none"; return; }
  bar.style.display = "block";
  const items = panier.map(id => entries.find(e => e.id === id)).filter(Boolean);
  items.sort((a,b) => a.year - b.year || a.month - b.month || a.day - b.day);

  bar.innerHTML = `
    <button class="jr-panier-toggle" id="jrPanierToggle">
      <span>Ma sélection · ${panier.length}</span><span>${panierOuvert ? "▼" : "▲"}</span>
    </button>
    ${panierOuvert ? `<div class="jr-panier-corps">
      ${items.map(e => `<div class="jr-panier-ligne">
        <span>${e.day} ${MOIS[e.month-1]} ${e.year} <em>${escapeHtml(collName(e.collectionId))}</em></span>
        <button data-retire="${e.id}" aria-label="Retirer">✕</button>
      </div>`).join("")}
      <div class="jr-panier-actions">
        <button id="jrPanierCopy">Copier ma sélection</button>
        <button id="jrPanierVide" class="jr-panier-vider">Tout vider</button>
      </div>
      <p class="jr-panier-msg" id="jrPanierMsg">Copiez cette liste et envoyez-la moi par message. Elle vaut demande, pas réservation : je confirme la disponibilité avant tout achat. Les thèmes indiqués sur les fiches sont déduits de la date de parution, sans garantie du contenu exact du numéro.</p>
    </div>` : ""}`;

  document.getElementById("jrPanierToggle").addEventListener("click", () => {
    panierOuvert = !panierOuvert; renderPanier();
  });
  bar.querySelectorAll("[data-retire]").forEach(b => {
    b.addEventListener("click", () => { basculerPanier(b.dataset.retire); renderPanier(); renderView(); });
  });
  const copy = document.getElementById("jrPanierCopy");
  if (copy) copy.addEventListener("click", () => {
    const msg = document.getElementById("jrPanierMsg");
    const txt = texteCommande();
    navigator.clipboard.writeText(txt).then(
      () => { msg.textContent = "✓ Copié. Colle-le dans ton message."; },
      () => { msg.textContent = txt; }
    );
  });
  const vider = document.getElementById("jrPanierVide");
  if (vider) vider.addEventListener("click", () => {
    panier = []; sauverPanier(); panierOuvert = false; renderPanier(); renderView();
  });
}

// ---------- Photos ----------
function photoUrl(nom) {
  return SUPABASE_URL + "/storage/v1/object/public/photos/" + nom;
}

async function compresserImage(file, maxDim, qualite) {
  maxDim = maxDim || 1400; qualite = qualite || 0.72;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("Image illisible"));
      i.src = url;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    if (Math.max(w,h) > maxDim) {
      const r = maxDim / Math.max(w,h);
      w = Math.round(w*r); h = Math.round(h*r);
    }
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, "image/jpeg", qualite));
  } finally { URL.revokeObjectURL(url); }
}

async function envoyerPhoto(e, file) {
  const blob = await compresserImage(file);
  const nom = e.id + "-" + Date.now() + ".jpg";
  const res = await fetch(SUPABASE_URL + "/storage/v1/object/photos/" + nom, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + bearer(),
      "Content-Type": "image/jpeg",
      "x-upsert": "true"
    },
    body: blob
  });
  if (!res.ok) throw new Error((await res.text()).slice(0,150));
  const ancienne = e.photo;
  e.photo = nom;
  await persistEntry(e);
  if (ancienne) { try { await supprimerFichier(ancienne); } catch (err) {} }
  return Math.round(blob.size/1024);
}

async function supprimerFichier(nom) {
  await fetch(SUPABASE_URL + "/storage/v1/object/photos/" + nom, {
    method: "DELETE",
    headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + bearer() }
  });
}

function setStatut(e, statut, permanent) {
  if (statut === "r") {
    if (e.status !== "r") e.statutAvant = (e.status === "s") ? "s" : "d";
    e.reservedUntil = permanent ? null : Date.now() + RESERVE_DAYS * 86400000;
  } else {
    e.reservedUntil = null;
    e.statutAvant = null;
  }
  e.status = statut;
  if (statut === "v") { if (!e.venduLe) e.venduLe = Date.now(); }
  else { e.venduLe = null; }
}

function renderStatsPanel() {
  const zone = document.getElementById("jrCalendar");
  document.getElementById("jrList").innerHTML = "";
  document.getElementById("jrCount").textContent = "";

  const mine = entries.filter(inCollection);
  const vendus = mine.filter(e => e.status === "v");
  const dates = vendus.filter(e => e.venduLe);
  const sansDate = vendus.length - dates.length;

  // ventes par mois (12 derniers)
  const parMois = {};
  dates.forEach(e => {
    const d = new Date(e.venduLe);
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    parMois[k] = (parMois[k] || 0) + 1;
  });
  const moisCles = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    moisCles.push({
      k: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"),
      lbl: MOIS[d.getMonth()].slice(0,4) + " " + String(d.getFullYear()).slice(2)
    });
  }
  const maxMois = Math.max(1, ...moisCles.map(m => parMois[m.k] || 0));

  const barres = (obj, limite) => {
    const arr = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, limite || 8);
    if (!arr.length) return `<p class="jr-stat-vide">Aucune donnée.</p>`;
    const max = arr[0][1];
    return arr.map(([k,v]) => `<div class="jr-bar-l">
      <span class="jr-bar-n">${escapeHtml(k)}</span>
      <span class="jr-bar-t"><span class="jr-bar-f" style="width:${Math.round(v/max*100)}%"></span></span>
      <span class="jr-bar-v">${v}</span>
    </div>`).join("");
  };

  const parColl = {}; vendus.forEach(e => { const n = collName(e.collectionId); parColl[n] = (parColl[n]||0)+1; });
  const parTag = {};  vendus.forEach(e => (e.tags||[]).forEach(t => { parTag[t] = (parTag[t]||0)+1; }));
  const parAnnee = {}; vendus.forEach(e => { parAnnee[e.year] = (parAnnee[e.year]||0)+1; });

  // taux d'écoulement par collection
  const ecoul = {};
  collections.forEach(c => {
    const tot = entries.filter(e => e.collectionId === c.id).length;
    const v = entries.filter(e => e.collectionId === c.id && e.status === "v").length;
    if (tot) ecoul[c.name] = Math.round(v/tot*100);
  });

  const bientot = entries.filter(e => e.status === "r")
    .sort((a,b) => (a.reservedUntil || Infinity) - (b.reservedUntil || Infinity));

  const dispo = mine.filter(e => e.status === "d" || e.status === "s").length;

  // --- valeur : ce que ça rapporte ---
  const prixDe = e => {
    const c = collections.find(x => x.id === e.collectionId);
    return (c && c.prix != null) ? Number(c.prix) : null;
  };
  const vendusValo = vendus.map(prixDe).filter(v => v != null);
  const ca = vendusValo.reduce((a,b) => a+b, 0);
  const prixMoyen = vendusValo.length ? (ca / vendusValo.length) : 0;
  const stockValo = mine.filter(e => e.status === "d" || e.status === "s")
    .map(prixDe).filter(v => v != null);
  const valeurStock = stockValo.reduce((a,b) => a+b, 0);

  // --- taux de vente par thème : ce qui part vraiment ---
  const totTag = {}, vendTag = {};
  mine.forEach(e => (e.tags||[]).forEach(t => {
    totTag[t] = (totTag[t]||0)+1;
    if (e.status === "v") vendTag[t] = (vendTag[t]||0)+1;
  }));
  const tauxTag = Object.keys(totTag)
    .filter(t => totTag[t] >= 5)
    .map(t => ({ t: t, pc: Math.round((vendTag[t]||0)/totTag[t]*100), n: vendTag[t]||0, tot: totTag[t] }))
    .sort((a,b) => b.pc - a.pc || b.n - a.n)
    .slice(0, 8);

  zone.innerHTML = `
    <div class="jr-stats-panel">
      <div class="jr-kpi">
        <div><b>${mine.length}</b><span>en base</span></div>
        <div><b>${dispo}</b><span>à vendre</span></div>
        <div><b>${vendus.length}</b><span>vendus</span></div>
        <div><b>${bientot.length}</b><span>réservés</span></div>
      </div>

      <h3>Argent</h3>
      <p class="jr-stat-sub">Estimation basse : tout est valorisé au prix de base de la collection, y compris les numéros spéciaux qui se vendent en réalité plus cher.</p>
      <div class="jr-kpi jr-kpi-clair">
        <div><b>${ca} €</b><span>encaissé</span></div>
        <div><b>${prixMoyen.toFixed(2)} €</b><span>panier moyen</span></div>
        <div><b>${valeurStock} €</b><span>stock restant</span></div>
        <div><b>${vendusValo.length}/${vendus.length}</b><span>ventes chiffrées</span></div>
      </div>
      ${vendusValo.length < vendus.length ? `<p class="jr-stat-note">Seules les collections dont le prix de base est renseigné sont chiffrées. Utilise le bouton ⚙ sur chaque onglet de collection pour le saisir.</p>` : ""}

      <h3>Ventes par mois</h3>
      ${dates.length ? `<div class="jr-mois">${moisCles.map(m => {
        const v = parMois[m.k] || 0;
        return `<div class="jr-mois-col" title="${v} vente${v>1?"s":""}">
          <span class="jr-mois-bar" style="height:${Math.round(v/maxMois*54)+2}px"></span>
          <span class="jr-mois-v">${v||""}</span>
          <span class="jr-mois-l">${m.lbl}</span>
        </div>`;
      }).join("")}</div>` : `<p class="jr-stat-vide">Les ventes seront datées à partir de maintenant.</p>`}
      ${sansDate ? `<p class="jr-stat-note">${sansDate} ventes antérieures ne sont pas datées : elles comptent dans les totaux mais pas dans ce graphique.</p>` : ""}

      <h3>Thèmes qui partent le mieux</h3>
      <p class="jr-stat-sub">Part du stock déjà vendue pour chaque thème. C'est l'indicateur à regarder avant de racheter un lot : un thème à fort pourcentage se vend vite, même s'il représente peu de ventes en volume.</p>
      ${tauxTag.length ? tauxTag.map(x => `<div class="jr-bar-l">
        <span class="jr-bar-n">${escapeHtml(x.t)}</span>
        <span class="jr-bar-t"><span class="jr-bar-f jr-bar-vert" style="width:${x.pc}%"></span></span>
        <span class="jr-bar-v">${x.pc}% <em>${x.n}/${x.tot}</em></span>
      </div>`).join("") : `<p class="jr-stat-vide">Pas encore assez de données.</p>`}

      <h3>Volumes vendus</h3>
      <h4>Par thème</h4>
      ${barres(parTag, 8)}
      <h4>Par année de parution</h4>
      ${barres(parAnnee, 6)}
      <h4>Par collection</h4>
      ${barres(parColl, 6)}

      <h3>Taux d'écoulement par collection</h3>
      ${Object.entries(ecoul).map(([n,pc]) => `<div class="jr-bar-l">
        <span class="jr-bar-n">${escapeHtml(n)}</span>
        <span class="jr-bar-t"><span class="jr-bar-f" style="width:${pc}%"></span></span>
        <span class="jr-bar-v">${pc}%</span>
      </div>`).join("") || `<p class="jr-stat-vide">Aucune donnée.</p>`}

      <h3>Réservations en cours</h3>
      ${bientot.length ? bientot.map(e => {
        const j = e.reservedUntil ? daysLeft(e.reservedUntil) : null;
        return `<div class="jr-resa ${j !== null && j<=0 ? "jr-resa-exp" : ""}">
          <span>${e.day} ${MOIS[e.month-1]} ${e.year} <em>${escapeHtml(collName(e.collectionId))}</em></span>
          <span>${j === null ? "sans limite" : (j > 0 ? j + " j" : "expirée")}</span>
        </div>`;
      }).join("") : `<p class="jr-stat-vide">Aucune réservation en cours.</p>`}
    </div>`;
}

// Palette sobre, une teinte par collection, attribuée dans l'ordre des onglets
const PALETTE_COLL = [
  { bg: "#2f4858", fg: "#ffffff" }, // ardoise
  { bg: "#7a3b3b", fg: "#ffffff" }, // brique
  { bg: "#3f5f3a", fg: "#ffffff" }, // olive
  { bg: "#6b4a7a", fg: "#ffffff" }, // prune
  { bg: "#8a5a2b", fg: "#ffffff" }, // tabac
  { bg: "#2b5f66", fg: "#ffffff" }, // sarcelle
  { bg: "#5a4632", fg: "#ffffff" }, // sépia
  { bg: "#7a3f5f", fg: "#ffffff" }  // grenat
];

function collCouleur(id) {
  const i = collections.findIndex(c => c.id === id);
  return PALETTE_COLL[(i < 0 ? 0 : i) % PALETTE_COLL.length];
}

function collName(id) {
  const c = collections.find(x => x.id === id);
  return c ? c.name : "?";
}

function escapeHtml(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function majFiche() { renderView(); brancherFiche(); }

function brancherFiche() {
  const e = entries.find(x => x.id === detailId);
  const zone = document.getElementById("jrDetail");
  if (!e || !zone) return;

  const close = document.getElementById("jrDetailClose");
  if (close) close.addEventListener("click", () => { detailId = null; render(); });

  const bp = document.getElementById("jrDetailPanier");
  if (bp) bp.addEventListener("click", () => {
    basculerPanier(e.id);
    renderPanier(); majFiche();
  });
  if (!isAdmin) return;

  const bdel = document.getElementById("jrDetailDel");
  if (bdel) bdel.addEventListener("click", () => {
    const z = document.getElementById("jrDelConfirm");
    z.innerHTML = `<div class="jr-delconf">Supprimer définitivement ce journal ?
      <button id="jrDelYes">Oui, supprimer</button>
      <button id="jrDelNo">Annuler</button></div>`;
    document.getElementById("jrDelNo").addEventListener("click", () => { z.innerHTML = ""; });
    document.getElementById("jrDelYes").addEventListener("click", async () => {
      const id = e.id;
      entries = entries.filter(x => x.id !== id);
      detailId = null;
      await persistDelete(id);
      render();
    });
  });

  zone.querySelectorAll("[data-dset]").forEach(btn => {
    btn.addEventListener("click", async () => {
      setStatut(e, btn.dataset.dset, !!btn.dataset.dperm);
      await persistEntry(e);
      renderStats();
      majFiche();
    });
  });

  zone.querySelectorAll("[data-rm]").forEach(btn => {
    btn.addEventListener("click", async () => {
      e.tags.splice(parseInt(btn.dataset.rm,10), 1);
      await persistEntry(e);
      renderTagCloud();
      majFiche();
    });
  });

  function tousLesThemes() {
    const c = {};
    entries.forEach(x => (x.tags||[]).forEach(t => { c[t] = (c[t]||0)+1; }));
    return Object.keys(c).sort((a,b) => {
      if (estMaster(a) !== estMaster(b)) return estMaster(a) ? -1 : 1;
      return c[b]-c[a] || a.localeCompare(b);
    });
  }

  function renderSugg() {
    const z = document.getElementById("jrSugg");
    if (!z) return;
    const saisie = normalize((document.getElementById("jrNewTag") || {}).value || "");
    const dispo = tousLesThemes()
      .filter(t => !(e.tags||[]).includes(t))
      .filter(t => !saisie || normalize(libelleTag(t)).includes(saisie));
    if (!dispo.length) {
      z.innerHTML = saisie ? `<span class="jr-sugg-vide">Aucun thème existant — « Ajouter » créera un nouveau thème.</span>` : "";
      return;
    }
    z.innerHTML = `<span class="jr-sugg-lbl">Thèmes existants</span>`
      + dispo.slice(0, 40).map(t =>
          `<button class="jr-suggtag ${estMaster(t)?"jr-suggtag-master":""}" data-sugg="${escapeHtml(t)}">${escapeHtml(libelleTag(t))}</button>`
        ).join("")
      + (dispo.length > 40 ? `<span class="jr-sugg-vide">+${dispo.length-40} autres — tape pour filtrer</span>` : "");
    z.querySelectorAll("[data-sugg]").forEach(b => {
      b.addEventListener("click", async () => {
        e.tags = e.tags || [];
        if (!e.tags.includes(b.dataset.sugg)) e.tags.push(b.dataset.sugg);
        await persistEntry(e);
        renderTagCloud();
        majFiche();
      });
    });
  }
  renderSugg();
  const champTag = document.getElementById("jrNewTag");
  if (champTag) champTag.addEventListener("input", renderSugg);

  const addTag = async () => {
    const input = document.getElementById("jrNewTag");
    const val = input.value.trim();
    if (!val) return;
    if (!e.tags) e.tags = [];
    if (!e.tags.some(t => normalize(t) === normalize(val))) e.tags.push(val);
    input.value = "";
    await persistEntry(e);
    renderTagCloud();
    majFiche();
  };
  document.getElementById("jrAddTagBtn").addEventListener("click", addTag);
  document.getElementById("jrNewTag").addEventListener("keydown", ev => { if (ev.key === "Enter") addTag(); });

  const pin = document.getElementById("jrPhotoInput");
  if (pin) pin.addEventListener("change", async () => {
    const f = pin.files && pin.files[0];
    if (!f) return;
    const msg = document.getElementById("jrPhotoMsg");
    msg.style.color = "#8a8070";
    msg.textContent = "Compression et envoi…";
    try {
      const ko = await envoyerPhoto(e, f);
      msg.textContent = "✓ Photo enregistrée (" + ko + " Ko)";
      majFiche();
    } catch (err) {
      msg.style.color = "#a33";
      msg.textContent = "✕ " + err.message;
    }
  });
  const pdel = document.getElementById("jrPhotoDel");
  if (pdel) pdel.addEventListener("click", async () => {
    const anc = e.photo;
    e.photo = null;
    await persistEntry(e);
    if (anc) { try { await supprimerFichier(anc); } catch (err) {} }
    majFiche();
  });

  document.getElementById("jrDetailSave").addEventListener("click", async () => {
    const newTitle = document.getElementById("jrDetailTitle").value;
    if (newTitle !== e.title) e.guessed = false;
    e.title = newTitle;
    e.note = document.getElementById("jrDetailNote").value;
    await persistEntry(e);
    detailId = null;
    render();
  });
}

function estMaster(t) { return typeof t === "string" && t.charAt(0) === "#"; }
function libelleTag(t) { return estMaster(t) ? t.slice(1) : t; }

function renderTagCloud() {
  const zone = document.getElementById("jrTagCloud");
  const counts = {};
  entries.filter(inCollection).forEach(e => {
    (e.tags||[]).forEach(t => { counts[t] = (counts[t]||0) + 1; });
  });
  const sorted = Object.keys(counts).sort((a,b) => {
    if (estMaster(a) !== estMaster(b)) return estMaster(a) ? -1 : 1;
    return counts[b]-counts[a] || a.localeCompare(b);
  });
  if (sorted.length === 0) { zone.innerHTML = ""; return; }

  const n = selectedTags.size;
  const nbMaster = sorted.filter(estMaster).length;
  const label = n === 0 ? `Thèmes (${sorted.length})` : `Thèmes · ${n} sélectionné${n>1?'s':''}`;

  zone.innerHTML = `
    <button class="jr-tagtoggle ${n>0?'on':''}" id="jrTagToggle">
      <span>${label}</span><span class="jr-caret">${tagsOpen ? '▲' : '▼'}</span>
    </button>
    <div class="jr-tagmenu" style="display:${tagsOpen ? 'flex' : 'none'};">
      ${sorted.map((t,i) => {
        const sep = (i === nbMaster && nbMaster > 0) ? `<span class="jr-tagsep"></span>` : "";
        return sep + `<button class="jr-cloudtag ${estMaster(t) ? "jr-cloudtag-master" : ""} ${selectedTags.has(t)?'on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(libelleTag(t))} <span>${counts[t]}</span></button>`;
      }).join("")}
      ${n > 0 ? `<button class="jr-clearTags" id="jrClearTags">Tout désélectionner</button>` : ""}
    </div>`;

  document.getElementById("jrTagToggle").addEventListener("click", () => {
    tagsOpen = !tagsOpen;
    renderTagCloud();
  });
  zone.querySelectorAll(".jr-cloudtag").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.tag;
      if (selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
      renderTagCloud();
      renderView();
    });
  });
  const clear = document.getElementById("jrClearTags");
  if (clear) clear.addEventListener("click", () => {
    selectedTags.clear();
    renderTagCloud();
    renderView();
  });
}

document.getElementById("jrNewColSave").addEventListener("click", async () => {
  const input = document.getElementById("jrNewColInput");
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const newCol = { id: uid(), name };
  collections.push(newCol);
  activeCollectionId = newCol.id;
  await saveCollections();
  input.value = "";
  document.getElementById("jrNewColForm").style.display = "none";
  render();
});
document.getElementById("jrNewColCancel").addEventListener("click", () => {
  document.getElementById("jrNewColInput").value = "";
  document.getElementById("jrNewColForm").style.display = "none";
});

document.getElementById("jrExportBtn").addEventListener("click", () => {
  const panel = document.getElementById("jrBackupPanel");
  const payload = JSON.stringify({ v: 4, collections: collections, entries: entries });
  panel.style.display = "block";
  panel.innerHTML = `
    <textarea id="jrBkText" readonly></textarea>
    <div class="jr-bk-actions"><button id="jrBkCopy">Copier la sauvegarde</button></div>
    <p class="jr-bk-msg" id="jrBkMsg">Copie ce texte et garde-le (mail, notes, fichier). Il contient toute ta collection.</p>`;
  const ta = document.getElementById("jrBkText");
  ta.value = payload;
  document.getElementById("jrBkCopy").addEventListener("click", async () => {
    const msg = document.getElementById("jrBkMsg");
    try {
      await navigator.clipboard.writeText(payload);
      msg.textContent = "✓ Sauvegarde copiée. Colle-la quelque part de sûr.";
    } catch (err) {
      ta.select();
      msg.textContent = "Sélectionne le texte ci-dessus et copie-le manuellement.";
    }
  });
});

document.getElementById("jrImportBtn").addEventListener("click", () => {
  const panel = document.getElementById("jrBackupPanel");
  panel.style.display = "block";
  panel.innerHTML = `
    <textarea id="jrBkImport" placeholder="Colle ici ta sauvegarde…"></textarea>
    <div class="jr-bk-actions"><button id="jrBkDo">Restaurer</button></div>
    <p class="jr-bk-msg" id="jrBkMsg2">Attention : cela remplacera les données actuelles.</p>`;
  document.getElementById("jrBkDo").addEventListener("click", async () => {
    const msg = document.getElementById("jrBkMsg2");
    try {
      const data = JSON.parse(document.getElementById("jrBkImport").value.trim());
      if (!data || !Array.isArray(data.entries) || !Array.isArray(data.collections)) {
        throw new Error("format");
      }
      entries = data.entries;
      collections = data.collections;
      entries.forEach(e => {
        if (!e.collectionId) e.collectionId = "default";
        if (!Array.isArray(e.tags)) e.tags = e.tag ? [e.tag] : [];
        if (typeof e.title !== "string") e.title = "";
        if (typeof e.note !== "string") e.note = "";
      });
      activeCollectionId = "__all";
      detailId = null;
      localSave();
      if (cloudOk && isAdmin) await pushAll();
      panel.style.display = "none";
      render();
    } catch (err) {
      msg.textContent = "✕ Sauvegarde illisible. Vérifie que tu as collé le texte en entier.";
      msg.style.color = "#a33";
    }
  });
});

document.getElementById("jrCmdBtn").addEventListener("click", () => {
  const p = document.getElementById("jrCmdPanel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  p.style.display = "block";
  p.innerHTML = `
    <textarea id="jrCmdText" placeholder="Colle ici la sélection que le client t'a envoyée…"></textarea>
    <div class="jr-bk-actions"><button id="jrCmdRead">Analyser</button></div>
    <div id="jrCmdResult"></div>`;
  document.getElementById("jrCmdRead").addEventListener("click", analyserCommande);
});

function analyserCommande() {
  const txt = document.getElementById("jrCmdText").value;
  const res = document.getElementById("jrCmdResult");
  const moisIdx = {};
  MOIS.forEach((m,i) => { moisIdx[normalize(m)] = i+1; });

  const trouves = [], introuvables = [];
  txt.split("\n").forEach(ligne => {
    const l = ligne.trim();
    if (!l) return;
    const m = normalize(l).replace(/\b(\d{1,2})(er|ere|eme|e)\b/g, "$1")
      .match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
    if (!m) return;
    const jour = parseInt(m[1],10), mois = moisIdx[m[2]], annee = parseInt(m[3],10);
    if (!mois) { introuvables.push(l); return; }
    const cands = entries.filter(e => e.year===annee && e.month===mois && e.day===jour);
    if (!cands.length) { introuvables.push(l); return; }
    // si la ligne mentionne une collection, on affine
    let choisi = cands[0];
    if (cands.length > 1) {
      const mieux = cands.find(e => normalize(l).includes(normalize(collName(e.collectionId)).slice(0,12)));
      if (mieux) choisi = mieux;
    }
    if (!trouves.some(t => t.id === choisi.id)) trouves.push(choisi);
  });

  if (!trouves.length && !introuvables.length) {
    res.innerHTML = `<p class="jr-cmd-msg">Aucune date reconnue. Le format attendu est « 12 septembre 1920 ».</p>`;
    return;
  }

  res.innerHTML = `
    <div class="jr-cmd-res">
      ${trouves.map(e => `<div class="jr-cmd-ligne">
        <span class="jr-badge jr-badge-${e.status}">${STATUS_LABEL[e.status]}</span>
        ${e.day} ${MOIS[e.month-1]} ${e.year} <em>${escapeHtml(collName(e.collectionId))}</em>
      </div>`).join("")}
      ${introuvables.length ? `<p class="jr-cmd-msg jr-cmd-warn">Non trouvés : ${introuvables.map(escapeHtml).join(" · ")}</p>` : ""}
      ${trouves.length ? `<div class="jr-bk-actions">
        <button id="jrCmdReserve">Réserver ces ${trouves.length}</button>
        <button id="jrCmdVendu">Marquer vendus</button>
      </div>` : ""}
      <p class="jr-cmd-msg" id="jrCmdMsg"></p>
    </div>`;

  const appliquer = async (statut) => {
    const msg = document.getElementById("jrCmdMsg");
    msg.textContent = "Enregistrement…";
    for (const e of trouves) {
      setStatut(e, statut);
      await persistEntry(e);
    }
    msg.textContent = `✓ ${trouves.length} journaux mis à jour.`;
    render();
  };
  const br = document.getElementById("jrCmdReserve");
  if (br) br.addEventListener("click", () => appliquer("r"));
  const bv = document.getElementById("jrCmdVendu");
  if (bv) bv.addEventListener("click", () => appliquer("v"));
}

// ---------- Ajout d'un lot ----------
function parseLotDates(txt) {
  const moisIdx = {};
  MOIS.forEach((m,i) => { moisIdx[normalize(m)] = i+1; });
  const dates = [], rejets = [];

  txt.split(/[\n;]/).forEach(ligne => {
    const l = normalize(ligne.trim())
      .replace(/^[•\-*·]\s*/, "")
      .replace(/\b(\d{1,2})(er|ere|eme|e)\b/g, "$1");
    if (!l) return;

    // plage : "du 1 au 15 janvier 1915" / "1-15 janvier 1915"
    let m = l.match(/^(?:du\s+)?(\d{1,2})\s*(?:au|a|-|à)\s*(\d{1,2})\s+([a-zé]+)\s+(\d{4})$/);
    if (m && moisIdx[m[3]]) {
      const mo = moisIdx[m[3]], an = parseInt(m[4],10);
      const d1 = parseInt(m[1],10), d2 = parseInt(m[2],10);
      const max = new Date(an, mo, 0).getDate();
      if (d1 >= 1 && d2 <= max && d1 <= d2) {
        for (let j = d1; j <= d2; j++) dates.push({ year: an, month: mo, day: j });
        return;
      }
    }
    // "12 septembre 1920"
    m = l.match(/^(\d{1,2})\s+([a-zé]+)\s+(\d{4})$/);
    if (m && moisIdx[m[2]]) {
      const mo = moisIdx[m[2]], an = parseInt(m[3],10), j = parseInt(m[1],10);
      if (j >= 1 && j <= new Date(an, mo, 0).getDate()) { dates.push({ year: an, month: mo, day: j }); return; }
    }
    // "12/09/1920"
    m = l.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if (m) {
      const j = parseInt(m[1],10), mo = parseInt(m[2],10), an = parseInt(m[3],10);
      if (mo >= 1 && mo <= 12 && j >= 1 && j <= new Date(an, mo, 0).getDate()) {
        dates.push({ year: an, month: mo, day: j }); return;
      }
    }
    rejets.push(ligne.trim());
  });
  return { dates, rejets };
}

function renderBulk() {
  const p = document.getElementById("jrBulkPanel");
  p.innerHTML = `
    <select id="jrBulkCol">${collections.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select>
    <select id="jrBulkStatut">
      <option value="d">Disponible</option>
      <option value="s">Numéro spécial</option>
      <option value="v">Vendu</option>
    </select>
    <textarea id="jrBulkText" placeholder="Une date par ligne :&#10;12 septembre 1920&#10;12/09/1920&#10;du 1 au 15 janvier 1915"></textarea>
    <div class="jr-bk-actions"><button id="jrBulkCheck">Vérifier</button></div>
    <div id="jrBulkResult"></div>`;
  document.getElementById("jrBulkCheck").addEventListener("click", verifierLot);
}

function verifierLot() {
  const colId = document.getElementById("jrBulkCol").value;
  const statut = document.getElementById("jrBulkStatut").value;
  const { dates, rejets } = parseLotDates(document.getElementById("jrBulkText").value);
  const res = document.getElementById("jrBulkResult");

  // doublons internes et déjà présents
  const vus = new Set(), uniques = [], doublons = [], deja = [];
  dates.forEach(d => {
    const k = d.year + "-" + d.month + "-" + d.day;
    if (vus.has(k)) { doublons.push(d); return; }
    vus.add(k);
    if (entries.some(e => e.collectionId === colId && e.year === d.year && e.month === d.month && e.day === d.day)) {
      deja.push(d); return;
    }
    uniques.push(d);
  });

  const fmt = d => `${d.day} ${MOIS[d.month-1]} ${d.year}`;
  res.innerHTML = `
    <div class="jr-cmd-res">
      <p class="jr-cmd-msg"><b>${uniques.length}</b> journaux à ajouter dans « ${escapeHtml(collName(colId))} ».</p>
      ${uniques.length ? `<p class="jr-cmd-msg">${uniques.slice(0,12).map(fmt).join(" · ")}${uniques.length > 12 ? " … et " + (uniques.length-12) + " autres" : ""}</p>` : ""}
      ${deja.length ? `<p class="jr-cmd-msg jr-cmd-warn">${deja.length} déjà présents, ignorés : ${deja.slice(0,6).map(fmt).join(" · ")}${deja.length>6?" …":""}</p>` : ""}
      ${doublons.length ? `<p class="jr-cmd-msg jr-cmd-warn">${doublons.length} doublons dans ta liste, comptés une fois.</p>` : ""}
      ${rejets.length ? `<p class="jr-cmd-msg jr-cmd-warn">${rejets.length} lignes non comprises : ${rejets.slice(0,5).map(escapeHtml).join(" · ")}${rejets.length>5?" …":""}</p>` : ""}
      ${uniques.length ? `<div class="jr-bk-actions"><button id="jrBulkGo">Ajouter ces ${uniques.length} journaux</button></div>` : ""}
      <p class="jr-cmd-msg" id="jrBulkMsg"></p>
    </div>`;

  const go = document.getElementById("jrBulkGo");
  if (go) go.addEventListener("click", async () => {
    const msg = document.getElementById("jrBulkMsg");
    msg.textContent = "Ajout en cours…";
    const nouveaux = uniques.map(d => ({
      id: uid(), year: d.year, month: d.month, day: d.day,
      status: statut, collectionId: colId,
      title: "", tags: [], note: "", guessed: false, reservedUntil: null
    }));
    nouveaux.forEach(n => entries.push(n));
    if (cloudOk && isAdmin) {
      try {
        for (let i = 0; i < nouveaux.length; i += 200) {
          await rest("journaux", {
            method: "POST",
            headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(nouveaux.slice(i, i+200).map(toRow))
          });
        }
      } catch (err) { msg.textContent = "✕ Échec : " + err.message; return; }
    }
    localSave();
    msg.textContent = `✓ ${nouveaux.length} journaux ajoutés.`;
    document.getElementById("jrBulkText").value = "";
    render();
  });
}

document.getElementById("jrBulkBtn").addEventListener("click", () => {
  const p = document.getElementById("jrBulkPanel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  p.style.display = "block";
  renderBulk();
});

// ---------- Réorganisation des thèmes ----------
function planTags() {
  const ops = [];
  const ajout = (nom, test) => {
    const cibles = entries.filter(e => test(e) && !(e.tags||[]).includes(nom));
    if (cibles.length) ops.push({ type: "ajout", nom: nom, n: cibles.length, cibles: cibles });
  };
  const renomme = (avant, apres) => {
    const cibles = entries.filter(e => (e.tags||[]).includes(avant));
    if (cibles.length) ops.push({ type: "renomme", nom: avant, vers: apres, n: cibles.length, cibles: cibles });
  };
  const retire = (nom) => {
    const cibles = entries.filter(e => (e.tags||[]).includes(nom));
    if (cibles.length) ops.push({ type: "retire", nom: nom, n: cibles.length, cibles: cibles });
  };

  ajout("#Première Guerre mondiale", e => e.year >= 1914 && e.year <= 1918);
  ajout("#Après-guerre", e => e.year >= 1919 && e.year <= 1921);
  renomme("Conquête spatiale", "#Conquête spatiale");
  renomme("Généraux", "Personnages");
  retire("Front de l'Ouest");
  retire("Guerre");
  retire("Orient");
  retire("Travail");
  retire("Mémoire");
  retire("Reconstruction");
  retire("Politique");
  retire("Économie");
  retire("Transports");
  retire("Sport");
  retire("Vie quotidienne");
  retire("Histoire");
  retire("Après-guerre");
  return ops;
}

function renderTagTool() {
  const p = document.getElementById("jrTagToolPanel");
  const ops = planTags();
  if (!ops.length) {
    p.innerHTML = `<p class="jr-cmd-msg">Rien à réorganiser, tout est déjà à jour.</p>`;
    return;
  }
  const mot = { ajout: "Ajouter", renomme: "Renommer", retire: "Supprimer" };
  p.innerHTML = `
    <div class="jr-cmd-res">
      ${ops.map(o => `<div class="jr-cmd-ligne">
        <b>${mot[o.type]}</b>
        <span>${escapeHtml(o.nom)}${o.vers ? " → " + escapeHtml(o.vers) : ""}</span>
        <em>${o.n} journaux</em>
      </div>`).join("")}
      <p class="jr-cmd-msg">Les thèmes en # sont les thèmes majeurs, affichés en premier et mis en avant.</p>
      <div class="jr-bk-actions"><button id="jrTagGo">Appliquer</button></div>
      <p class="jr-cmd-msg" id="jrTagMsg"></p>
    </div>`;

  document.getElementById("jrTagGo").addEventListener("click", async () => {
    const msg = document.getElementById("jrTagMsg");
    const touches = new Set();
    ops.forEach(o => {
      o.cibles.forEach(e => {
        e.tags = e.tags || [];
        if (o.type === "ajout") e.tags.unshift(o.nom);
        else if (o.type === "retire") e.tags = e.tags.filter(t => t !== o.nom);
        else {
          e.tags = e.tags.filter(t => t !== o.nom);
          if (!e.tags.includes(o.vers)) e.tags.push(o.vers);
        }
        touches.add(e);
      });
    });
    const liste = [...touches];
    msg.textContent = `Enregistrement de ${liste.length} journaux…`;
    if (cloudOk && isAdmin) {
      try {
        for (let i = 0; i < liste.length; i += 200) {
          await rest("journaux", {
            method: "POST",
            headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(liste.slice(i, i+200).map(toRow))
          });
        }
      } catch (err) { msg.textContent = "✕ Échec : " + err.message; return; }
    }
    localSave();
    msg.textContent = `✓ ${liste.length} journaux mis à jour.`;
    selectedTags.clear();
    render();
  });
}

document.getElementById("jrTagToolBtn").addEventListener("click", () => {
  const p = document.getElementById("jrTagToolPanel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  p.style.display = "block";
  renderTagTool();
});

(async function init() {
  try {
    await loadEntries();
    chargerPanier();
    lireLien();
    render();
    if (!cloudOk) {
      showStorageWarning("Base en ligne injoignable. Affichage de la dernière copie locale — les modifications ne seront pas partagées.");
    }
  } catch (err) {
    document.getElementById("jrApp").insertAdjacentHTML("afterbegin",
      `<div class="jr-storagewarn">Un problème est survenu au chargement : ${escapeHtml(String(err && err.message || err))}.<br>
       Essaie de recharger la page, ou restaure une sauvegarde depuis le bas de la page.</div>`);
  }
})();
</script>
