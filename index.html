function guessPeriode(y,m,d) {
  const n = y*10000 + m*100 + d;
  const titles = [], tags = new Set();
  PERIODES.forEach(([a,b,t,tg]) => {
    if (n >= a && n <= b) { titles.push(t); tg.forEach(x => tags.add(x)); }
  });
  if (titles.length === 0) return null;
  return { title: titles.join(" · "), tags: Array.from(tags) };
}

    id: uid(), year: y, month: m, day: d, status: statut || "d",

function bearer() {
  return (session && session.access_token) ? session.access_token : SUPABASE_KEY;
}

async function rest(path, opts = {}, retry = true) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + bearer(),
      "Content-Type": "application/json"
    }, opts.headers || {}),
    body: opts.body
  });
  if (res.status === 401 && retry && session && session.refresh_token) {
    if (await refreshSession()) return rest(path, opts, false);
  }
  if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0,200));
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function signIn(email, password) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  });
  if (!res.ok) return false;
  const d = await res.json();
  session = { access_token: d.access_token, refresh_token: d.refresh_token, email: (d.user && d.user.email) || email };
  window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  isAdmin = true;
  return true;
}

async function refreshSession() {
  if (!session || !session.refresh_token) return false;
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  if (!res.ok) { signOut(); return false; }
  const d = await res.json();
  session = { access_token: d.access_token, refresh_token: d.refresh_token, email: session.email };
  window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  isAdmin = true;
  return true;
}

function signOut() {
  session = null; isAdmin = false;
  window.localStorage.removeItem(SESSION_KEY);
}

function restoreSession() {
  try {
    const raw = window.localStorage.getItem(SESSION_KEY);
    if (raw) { session = JSON.parse(raw); isAdmin = true; }
  } catch (e) { session = null; isAdmin = false; }
}

// ---------- Lecture ----------
async function loadEntries() {
  restoreSession();
  activeCollectionId = "__all";
  try {
    const cols = await rest("collections?select=*&order=ordre.asc");
    const rows = await rest("journaux?select=*&limit=10000");
    cloudOk = true;
    baseRemplie = !!(rows && rows.length);
    if (baseRemplie) {
      entries = rows.map(fromRow);
      collections = (cols && cols.length)
        ? cols.map(c => ({ id: c.id, name: c.name, prix: c.prix, gallica: c.gallica }))
        : DEFAULT_COLLECTIONS.slice();
      localSave();
      return;
    }
    // base vide : on prépare les données mais on n'écrit rien sans connexion
    entries = seedEntries();
    collections = DEFAULT_COLLECTIONS.slice();
    return;
  } catch (e) {
    cloudOk = false;
  }
  // hors ligne : on retombe sur la copie locale
  try {
    const rawC = window.localStorage.getItem(COLLECTIONS_KEY);
    const rawE = window.localStorage.getItem(STORAGE_KEY);
    if (rawE) {
      entries = JSON.parse(rawE);
      collections = rawC ? JSON.parse(rawC) : DEFAULT_COLLECTIONS.slice();
      entries.forEach(e => {
        if (!e.collectionId) e.collectionId = "default";
        if (!Array.isArray(e.tags)) e.tags = [];
        if (typeof e.title !== "string") e.title = "";
        if (typeof e.note !== "string") e.note = "";
      });
      return;
    }
  } catch (e) { /* rien en local non plus */ }
  entries = seedEntries();
  collections = DEFAULT_COLLECTIONS.slice();
  localSave();
}

function normalize(s) {
  return (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function formatDate(e) {
  return `${e.day} ${MOIS[e.month-1]} <span class="jr-row-year">${e.year}</span>`;
}

function daysLeft(reservedUntil) {
  return Math.ceil((reservedUntil - Date.now()) / 86400000);
}

function checkExpiredReservations() {
  return entries.filter(e => e.status === "r" && e.reservedUntil && e.reservedUntil < Date.now());
}

function parseSearch(q) {
  q = q.trim();
  if (!q) return null;
  let m = q.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let year = parseInt(m[3], 10);
    if (year < 100) year += 1900;
    return { day: parseInt(m[1],10), month: parseInt(m[2],10), year };
  }
  m = q.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return { day: parseInt(m[1],10), month: parseInt(m[2],10) };
  const monthIdx = MOIS.findIndex(mo => normalize(mo) === normalize(q));
  if (monthIdx >= 0) return { month: monthIdx + 1 };
  m = q.match(/^(19\d{2})$/);
  if (m) return { year: parseInt(m[1],10) };
  return { text: normalize(q) };
}

function matchesSearch(e, parsed) {
  if (!parsed) return true;
  if (parsed.text) {
    return (e.tags || []).some(t => normalize(libelleTag(t)).includes(parsed.text))
      || normalize(e.title).includes(parsed.text)
      || normalize(e.note).includes(parsed.text)
      || normalize(STATUS_LABEL[e.status]).includes(parsed.text);
  }
  if (parsed.day && e.day !== parsed.day) return false;
  if (parsed.month && e.month !== parsed.month) return false;
  if (parsed.year && e.year !== parsed.year) return false;
  return true;
}

  const VISIBLES = 5;

    colEditOuvert = false;
    render();
  });
}

function renderStats() {
  const counts = { d: 0, s: 0, v: 0, r: 0 };
  entries.filter(inCollection).forEach(e => counts[e.status]++);
  const labels = [["d","Disponibles"],["s","Spéciaux"],["v","Vendus"],["r","Réservés"]];
  document.getElementById("jrStats").innerHTML = labels.map(([k,l]) =>
    `<button class="jr-stat ${activeFilters.has(k)?'on':''}" data-filter="${k}">
       <div class="n">${counts[k]}</div><div class="l">${l}</div>
     </button>`
  ).join("");
  document.querySelectorAll(".jr-stat").forEach(card => {
    card.addEventListener("click", () => {
      const k = card.dataset.filter;
      if (activeFilters.has(k)) activeFilters.delete(k); else activeFilters.add(k);
      renderStats();
      renderView();
    });
  });
}

function renderAlerts() {
  const expired = checkExpiredReservations();
  const zone = document.getElementById("jrAlertZone");
  if (expired.length === 0) { zone.innerHTML = ""; return; }
  const colName = id => (collections.find(c => c.id === id) || {}).name || "";
  zone.innerHTML = `<div class="jr-alert">
    <h3>${expired.length} réservation${expired.length > 1 ? "s" : ""} arrivée${expired.length > 1 ? "s" : ""} à échéance</h3>
    ${expired.map(e => `
      <div class="jr-alert-row">
        <span>${e.day} ${MOIS[e.month-1]} ${e.year}${collections.length > 1 ? ' · ' + colName(e.collectionId) : ''}</span>
        <span class="jr-alert-btns">
          <button data-action="extend" data-id="${e.id}">Prolonger ${RESERVE_DAYS}j</button>
          <button data-action="release" data-id="${e.id}">Remettre dispo</button>
        </span>
      </div>`).join("")}
  </div>`;
  zone.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.id);
      if (!entry) return;
      if (btn.dataset.action === "extend") {
        entry.reservedUntil = Date.now() + RESERVE_DAYS * 86400000;
      } else {
        setStatut(entry, entry.statutAvant || "d");
      }
      await persistEntry(entry);
      render();
    });
  });
}

function inCollection(e) {
  return activeCollectionId === "__all" || e.collectionId === activeCollectionId;
}

function renderList() {
  const parsed = parseSearch(searchQuery);
  let filtered = entries.filter(e =>
    inCollection(e)
    && (activeFilters.size === 0 || activeFilters.has(e.status))
    && (selectedTags.size === 0 || (e.tags||[]).some(t => selectedTags.has(t)))
    && matchesSearch(e, parsed)
  );
  filtered.sort((a,b) => a.year - b.year || a.month - b.month || a.day - b.day);

  document.getElementById("jrCount").textContent = `${filtered.length} date${filtered.length !== 1 ? "s" : ""}`;

  if (filtered.length === 0) {
    document.getElementById("jrList").innerHTML = `<div class="jr-empty">Aucun journal ne correspond à cette recherche.</div>`;
    return;
  }

  document.getElementById("jrList").innerHTML = filtered.map(e => {
    let sub = e.title || "";
    let cls = e.guessed && e.title ? "jr-row-tag jr-guessed" : "jr-row-tag";
    if (e.guessed && e.title) sub = "≈ " + sub;
    if (e.status === "r") {
      sub = e.title || "";
      cls = "jr-row-tag";
    }
    const cc = collCouleur(e.collectionId);
    const colTag = activeCollectionId === "__all"
      ? `<span class="jr-colchip" style="background:${cc.bg};color:${cc.fg}">${escapeHtml(collName(e.collectionId))}</span>` : "";
    const tags = e.tags || [];
    const tagsTries = tags.slice().sort((a,b) => (estMaster(b)?1:0) - (estMaster(a)?1:0));
    const tagsHtml = tagsTries.length
      ? `<span class="jr-rowtags">${tagsTries.slice(0,4).map(t => `<span class="jr-rowtag ${estMaster(t)?"jr-rowtag-master":""}">${escapeHtml(libelleTag(t))}</span>`).join("")}${tagsTries.length > 4 ? `<span class="jr-rowtag jr-rowtag-plus">+${tagsTries.length-4}</span>` : ""}</span>`
      : "";
    const ligne = `<div class="jr-row" data-id="${e.id}">
      ${statusEditId === e.id ? `
        <div class="jr-row-top">
          <div class="jr-row-date">${formatDate(e)}</div>
          <div class="jr-statuspick">
            <button class="jr-badge jr-badge-d ${e.status==='d'?'cur':''}" data-set="d" data-eid="${e.id}">Disponible</button>
            <button class="jr-badge jr-badge-s ${e.status==='s'?'cur':''}" data-set="s" data-eid="${e.id}">Spécial</button>
            <button class="jr-badge jr-badge-v ${e.status==='v'?'cur':''}" data-set="v" data-eid="${e.id}">Vendu</button>
            <button class="jr-badge jr-badge-r ${e.status==='r'?'cur':''}" data-set="r" data-perm="1" data-eid="${e.id}">Réservé</button>
          </div>
          <button class="jr-pickcancel" data-cancelstatus="1">✕</button>
        </div>
      ` : `
      <div class="jr-row-top">
        <div class="jr-row-open jr-row-datewrap" data-open="${e.id}">
          <span class="jr-row-date">${formatDate(e)}</span>
        </div>
        ${isAdmin
          ? `<button class="jr-badge jr-badge-${e.status} jr-badge-btn" data-status="${e.id}">${STATUS_LABEL[e.status]}</button>`
          : `<span class="jr-badge jr-badge-${e.status}">${STATUS_LABEL[e.status]}</span>`}
        ${colTag}
      </div>
      ${(sub || tagsHtml) ? `<div class="jr-row-open jr-row-bas" data-open="${e.id}">
        ${sub ? `<span class="${cls}">${escapeHtml(sub)}</span>` : ""}
        ${tagsHtml}
      </div>` : `<span class="jr-row-bas"></span>`}
      <div class="jr-row-act">
        ${isAdmin || (e.status !== "d" && e.status !== "s") ? "" :
          `<button class="jr-add-panier ${dansPanier("j:"+e.id) ? "on" : ""}" data-panier="j:${e.id}" aria-label="Ajouter à ma sélection">${dansPanier("j:"+e.id) ? "✓" : "+"}</button>`}
      </div>
      `}
    </div>`;
    return detailId === e.id ? ficheHtml(e) : ligne;
  }).join("");

  document.querySelectorAll(".jr-row-open").forEach(el => {
    el.addEventListener("click", () => { pendingDeleteId = null; statusEditId = null; ouvrirFiche(el.dataset.open); });
  });

  document.querySelectorAll(".jr-badge-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      statusEditId = btn.dataset.status;
      pendingDeleteId = null;
      renderList();
    });
  });
  document.querySelectorAll("[data-cancelstatus]").forEach(btn => {
    btn.addEventListener("click", () => { statusEditId = null; renderList(); });
  });
  document.querySelectorAll("[data-set]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.eid);
      if (!entry) return;
      setStatut(entry, btn.dataset.set, !!btn.dataset.perm);
      statusEditId = null;
      await persistEntry(entry);
      render();
    });
  });
  document.querySelectorAll("[data-panier]").forEach(btn => {
    btn.addEventListener("click", () => {
      basculerPanier(btn.dataset.panier);
      renderPanier();
      renderView();
    });
  });
  document.querySelectorAll(".jr-del-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      pendingDeleteId = btn.dataset.id;
      renderList();
    });
  });
  document.querySelectorAll(".jr-confirm-no").forEach(btn => {
    btn.addEventListener("click", () => { pendingDeleteId = null; renderList(); });
  });
  document.querySelectorAll(".jr-confirm-yes").forEach(btn => {
    btn.addEventListener("click", async () => {
      const delId = btn.dataset.yes;
      entries = entries.filter(x => x.id !== delId);
      pendingDeleteId = null;
      if (detailId === delId) detailId = null;
      await persistDelete(delId);
      render();
    });
  });
}

function prixAffiche(e, col) {
  if (e.status === "v") return "";
  if (col.prix == null) return "";
  if (e.status === "s") return "À partir de " + col.prix + " € — me contacter";
  return col.prix + " €";
}

function currentFiltered() {
  const parsed = parseSearch(searchQuery);
  return entries.filter(e =>
    inCollection(e)
    && (activeFilters.size === 0 || activeFilters.has(e.status))
    && (selectedTags.size === 0 || (e.tags||[]).some(t => selectedTags.has(t)))
    && matchesSearch(e, parsed)
  );
}

function renderView() {
  document.querySelectorAll(".jr-vbtn").forEach(b => {
    const admin = b.dataset.view === "stats";
    b.className = "jr-vbtn" + (admin ? " jr-vbtn-admin" : "") + (b.dataset.view === viewMode ? " on" : "");
    b.style.display = admin && !isAdmin ? "none" : "inline-block";
    b.onclick = () => { viewMode = b.dataset.view; detailId = null; render(); };
  });
  document.getElementById("jrShare").onclick = copierLien;

  const liste = document.getElementById("jrList");
  const cal = document.getElementById("jrCalendar");
  if (!isAdmin && viewMode === "stats") viewMode = "liste";

  if (viewMode === "stats") {
    liste.innerHTML = "";
    renderStatsPanel();
  } else if (viewMode === "dates") {
    liste.innerHTML = "";
    renderDatesPanel();
  } else if (viewMode === "calendrier") {
    liste.innerHTML = "";
    renderCalendrier();
  } else {
    cal.innerHTML = "";
    renderList();
  }
}

function renderCalendrier() {
  const zone = document.getElementById("jrCalendar");
  const filtered = currentFiltered();
  document.getElementById("jrCount").textContent =
    `${filtered.length} date${filtered.length !== 1 ? "s" : ""}`;

  if (filtered.length === 0) {
    zone.innerHTML = `<div class="jr-empty">Aucun journal ne correspond à cette recherche.</div>`;
    return;
  }

  // index : "annee-mois-jour" -> liste d'entrées (une date peut exister dans plusieurs collections)
  const index = {};
  filtered.forEach(e => {
    const k = e.year + "-" + e.month + "-" + e.day;
    (index[k] = index[k] || []).push(e);
  });
  const PRIORITE = { d: 4, s: 3, r: 2, v: 1 };
  const annees = [...new Set(filtered.map(e => e.year))].sort((a,b) => a-b);

  zone.innerHTML = annees.map(an => {
    const mois = [];
    for (let m = 1; m <= 12; m++) {
      const nbJours = new Date(an, m, 0).getDate();
      // 0 = lundi
      const premier = (new Date(an, m-1, 1).getDay() + 6) % 7;
      const cellules = [];
      for (let i = 0; i < premier; i++) cellules.push(`<span class="jr-cal-vide"></span>`);
      let aDuStock = false;
      for (let j = 1; j <= nbJours; j++) {
        const liste = index[an + "-" + m + "-" + j];
        if (liste && liste.length) {
          aDuStock = true;
          const best = liste.slice().sort((a,b) => PRIORITE[b.status] - PRIORITE[a.status])[0];
          const multi = liste.length > 1;
          const infobulle = liste.map(x => collName(x.collectionId) + (x.title ? " — " + x.title : "")).join(" / ");
          const ouvert = liste.some(x => x.id === detailId);
          cellules.push(`<button class="jr-cal-jour jr-cal-${best.status}${multi ? " jr-cal-multi" : ""}${ouvert ? " jr-cal-sel" : ""}" data-cal="${best.id}" data-multi="${multi ? liste.length : ""}" data-date="${j}/${m}/${an}" title="${escapeHtml(infobulle)}">${j}</button>`);
        } else {
          cellules.push(`<span class="jr-cal-jour jr-cal-off">${j}</span>`);
        }
      }
      if (!aDuStock) continue;
      mois.push(`<div class="jr-cal-mois">
        <div class="jr-cal-nom">${MOIS[m-1]}</div>
        <div class="jr-cal-entetes"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="jr-cal-grille">${cellules.join("")}</div>
      </div>`);
      const sel = entries.find(x => x.id === detailId);
      if (sel && sel.year === an && sel.month === m) {
        mois.push(`<div class="jr-cal-fiche">${ficheHtml(sel)}</div>`);
      }
    }
    return `<div class="jr-cal-annee"><h2>${an}</h2><div class="jr-cal-mois-wrap">${mois.join("")}</div></div>`;
  }).join("");

  zone.querySelectorAll("[data-cal]").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.multi) {
        // plusieurs journaux à cette date : on bascule en liste filtrée sur la date exacte
        searchQuery = b.dataset.date;
        const inp = document.getElementById("jrSearch");
        if (inp) inp.value = searchQuery;
        viewMode = "liste";
        detailId = null;
        render();
      } else {
        ouvrirFiche(b.dataset.cal);
      }
    });
  });
}

function copierLien() {
  const p = new URLSearchParams();
  if (searchQuery.trim()) p.set("q", searchQuery.trim());
  if (selectedTags.size) p.set("tags", [...selectedTags].join(","));
  if (activeCollectionId !== "__all") p.set("col", activeCollectionId);
  if (viewMode !== "calendrier") p.set("vue", viewMode);
  const url = location.origin + location.pathname + (p.toString() ? "?" + p.toString() : "");
  const btn = document.getElementById("jrShare");
  navigator.clipboard.writeText(url).then(
    () => { btn.textContent = "✓ Lien copié"; setTimeout(() => btn.textContent = "Copier le lien", 2000); },
    () => { btn.textContent = "Copie impossible"; setTimeout(() => btn.textContent = "Copier le lien", 2000); }
  );
}

function lireLien() {
  const p = new URLSearchParams(location.search);
  if (p.get("q")) {
    searchQuery = p.get("q");
    const inp = document.getElementById("jrSearch");
    if (inp) inp.value = searchQuery;
  }
  if (p.get("tags")) p.get("tags").split(",").filter(Boolean).forEach(t => selectedTags.add(t));
  if (p.get("col")) activeCollectionId = p.get("col");
  if (p.get("vue")) viewMode = p.get("vue");
}

// ---------- Liste de courses (côté visiteur, stockée dans son navigateur) ----------
const PANIER_KEY = "mja-panier";
let panier = [];
let panierOuvert = false;

function chargerPanier() {
  try {
    const raw = window.localStorage.getItem(PANIER_KEY);
    panier = raw ? JSON.parse(raw) : [];
  } catch (e) { panier = []; }
  // on nettoie les références disparues
  panier = panier.map(x => x.indexOf(":") === 1 ? x : "j:" + x)
                 .filter(x => x.slice(0,2) === "c:" ? true : entries.some(e => e.id === x.slice(2)));
}

function sauverPanier() {
  try { window.localStorage.setItem(PANIER_KEY, JSON.stringify(panier)); } catch (e) {}
}

function dansPanier(id) { return panier.indexOf(id) !== -1; }

function basculerPanier(id) {
  const i = panier.indexOf(id);
  if (i === -1) panier.push(id); else panier.splice(i, 1);
  sauverPanier();
}

function itemPanier(cle) {
  if (cle.slice(0,2) === "c:") {
    const c = cartes.find(x => x.id === cle.slice(2));
    return c ? { type: "carte", obj: c, libelle: `Carte n°${c.num} — ${c.nom}` } : null;
  }
  const e = entries.find(x => x.id === cle.slice(2));
  return e ? { type: "journal", obj: e,
    libelle: `${e.day} ${MOIS[e.month-1]} ${e.year} — ${collName(e.collectionId)}` } : null;
}

function texteCommande() {
  const items = panier.map(itemPanier).filter(Boolean);
  const j = items.filter(i => i.type === "journal");
  const c = items.filter(i => i.type === "carte");
  let t = `Ma sélection — ${items.length} article${items.length > 1 ? "s" : ""}\n`;
  if (j.length) t += "\nJournaux :\n" + j.map(i => "• " + i.libelle).join("\n") + "\n";
  if (c.length) t += "\nCartes :\n" + c.map(i => "• " + i.libelle).join("\n") + "\n";
  return t.trim();
}

function renderPanier() {
  const bar = document.getElementById("jrPanierBar");
  if (!bar) return;
  if (panier.length === 0) { bar.innerHTML = ""; bar.style.display = "none"; return; }
  bar.style.display = "block";
  const items = panier.map(c => ({ cle: c, it: itemPanier(c) })).filter(x => x.it);

  bar.innerHTML = `
    <button class="jr-panier-toggle" id="jrPanierToggle">
      <span>Ma sélection · ${panier.length}</span><span>${panierOuvert ? "▼" : "▲"}</span>
    </button>
    ${panierOuvert ? `<div class="jr-panier-corps">
      ${items.map(x => `<div class="jr-panier-ligne">
        <span>${escapeHtml(x.it.libelle)} <em>${x.it.type === "carte" ? "carte" : "journal"}</em></span>
        <button data-retire="${x.cle}" aria-label="Retirer">✕</button>
      </div>`).join("")}
      <div class="jr-panier-actions">
        <button id="jrPanierCopy">Copier ma sélection</button>
        <button id="jrPanierVide" class="jr-panier-vider">Tout vider</button>
      </div>
      <p class="jr-panier-msg" id="jrPanierMsg">Copiez cette liste et envoyez-la moi par message. Elle vaut demande, pas réservation : je confirme la disponibilité avant tout achat. Les thèmes indiqués sur les fiches sont déduits de la date de parution, sans garantie du contenu exact du numéro.</p>
    </div>` : ""}`;

  document.getElementById("jrPanierToggle").addEventListener("click", () => {
    panierOuvert = !panierOuvert; renderPanier();
  });
  bar.querySelectorAll("[data-retire]").forEach(b => {
    b.addEventListener("click", () => {
      basculerPanier(b.dataset.retire); renderPanier();
      if (univers === "cartes") renderCartes(); else renderView();
    });
  });
  const copy = document.getElementById("jrPanierCopy");
  if (copy) copy.addEventListener("click", () => {
    const msg = document.getElementById("jrPanierMsg");
    const txt = texteCommande();
    navigator.clipboard.writeText(txt).then(
      () => { msg.textContent = "✓ Copié. Colle-le dans ton message."; },
      () => { msg.textContent = txt; }
    );
  });
  const vider = document.getElementById("jrPanierVide");
  if (vider) vider.addEventListener("click", () => {
    panier = []; sauverPanier(); panierOuvert = false; renderPanier();
    if (univers === "cartes") renderCartes(); else renderView();
  });
}

// ---------- Photos ----------
function photoUrl(nom) {
  return SUPABASE_URL + "/storage/v1/object/public/photos/" + nom;
}

async function compresserImage(file, maxDim, qualite) {
  maxDim = maxDim || 1400; qualite = qualite || 0.72;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("Image illisible"));
      i.src = url;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    if (Math.max(w,h) > maxDim) {
      const r = maxDim / Math.max(w,h);
      w = Math.round(w*r); h = Math.round(h*r);
    }
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, "image/jpeg", qualite));
  } finally { URL.revokeObjectURL(url); }
}

async function envoyerPhoto(e, file) {
  const blob = await compresserImage(file);
  const nom = e.id + "-" + Date.now() + ".jpg";
  const res = await fetch(SUPABASE_URL + "/storage/v1/object/photos/" + nom, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + bearer(),
      "Content-Type": "image/jpeg",
      "x-upsert": "true"
    },
    body: blob
  });
  if (!res.ok) throw new Error((await res.text()).slice(0,150));
  const ancienne = e.photo;
  e.photo = nom;
  await persistEntry(e);
  if (ancienne) { try { await supprimerFichier(ancienne); } catch (err) {} }
  return Math.round(blob.size/1024);
}

async function supprimerFichier(nom) {
  await fetch(SUPABASE_URL + "/storage/v1/object/photos/" + nom, {
    method: "DELETE",
    headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + bearer() }
  });
}

function setStatut(e, statut, permanent) {
  if (statut === "r") {
    if (e.status !== "r") e.statutAvant = (e.status === "s") ? "s" : "d";
    e.reservedUntil = permanent ? null : Date.now() + RESERVE_DAYS * 86400000;
  } else {
    e.reservedUntil = null;
    e.statutAvant = null;
  }
  e.status = statut;
  if (statut === "v") { if (!e.venduLe) e.venduLe = Date.now(); }
  else { e.venduLe = null; }
}

function renderDatesPanel() {
  const zone = document.getElementById("jrCalendar");
  document.getElementById("jrList").innerHTML = "";
  const filtered = currentFiltered();

  // combien de journaux pour chaque jour/mois, toutes années confondues
  const compte = {};
  filtered.forEach(e => {
    const k = e.month + "-" + e.day;
    compte[k] = (compte[k] || 0) + 1;
  });
  const total = Object.keys(compte).length;
  document.getElementById("jrCount").textContent =
    `${total} date${total !== 1 ? "s" : ""} du calendrier couverte${total !== 1 ? "s" : ""}`;

  const JOURS_MOIS = [31,29,31,30,31,30,31,31,30,31,30,31];
  // paliers nets plutôt qu'un dégradé continu : la différence 1/2/3 doit se voir
  const PALIERS = [
    { min: 5, bg: "#1f5417", fg: "#ffffff", lbl: "5 et +" },
    { min: 4, bg: "#3a7d2a", fg: "#ffffff", lbl: "4" },
    { min: 3, bg: "#63a94b", fg: "#122c0d", lbl: "3" },
    { min: 2, bg: "#8dc077", fg: "#122c0d", lbl: "2" },
    { min: 1, bg: "#b9d9ab", fg: "#122c0d", lbl: "1" }
  ];
  const palier = n => PALIERS.find(p => n >= p.min) || PALIERS[PALIERS.length-1];

  zone.innerHTML = `
    <p class="jr-dates-intro">Toutes années confondues. Cliquez sur un jour pour voir les journaux parus à cette date, quelle que soit l'année.</p>
    <div class="jr-legende">
      <span>Journaux disponibles à cette date :</span>
      ${PALIERS.slice().reverse().map(p => `<span class="jr-leg-case" style="background:${p.bg};color:${p.fg}">${p.lbl}</span>`).join("")}
      <span class="jr-leg-case jr-leg-vide">0</span>
    </div>
    <div class="jr-dates-wrap">
      ${MOIS.map((nom, mi) => {
        const m = mi + 1;
        const cases = [];

          const n = compte[m + "-" + j] || 0;
          if (n === 0) {
            cases.push(`<span class="jr-dj jr-dj-off">${j}</span>`);
          } else {

              style="background:${pal.bg};color:${pal.fg}"

function renderStatsPanel() {
  const zone = document.getElementById("jrCalendar");
  document.getElementById("jrList").innerHTML = "";
  document.getElementById("jrCount").textContent = "";

  const mine = entries.filter(inCollection);
  const vendus = mine.filter(e => e.status === "v");
  const dates = vendus.filter(e => e.venduLe);
  const sansDate = vendus.length - dates.length;

  // ventes par mois (12 derniers)
  const parMois = {};
  dates.forEach(e => {
    const d = new Date(e.venduLe);
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    parMois[k] = (parMois[k] || 0) + 1;
  });
  const moisCles = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    moisCles.push({
      k: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"),
      lbl: MOIS[d.getMonth()].slice(0,4) + " " + String(d.getFullYear()).slice(2)
    });
  }
  const maxMois = Math.max(1, ...moisCles.map(m => parMois[m.k] || 0));

  const barres = (obj, limite) => {
    const arr = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, limite || 8);
    if (!arr.length) return `<p class="jr-stat-vide">Aucune donnée.</p>`;
    const max = arr[0][1];
    return arr.map(([k,v]) => `<div class="jr-bar-l">
      <span class="jr-bar-n">${escapeHtml(k)}</span>
      <span class="jr-bar-t"><span class="jr-bar-f" style="width:${Math.round(v/max*100)}%"></span></span>
      <span class="jr-bar-v">${v}</span>
    </div>`).join("");
  };

  const parColl = {}; vendus.forEach(e => { const n = collName(e.collectionId); parColl[n] = (parColl[n]||0)+1; });
  const parTag = {};  vendus.forEach(e => (e.tags||[]).forEach(t => { parTag[t] = (parTag[t]||0)+1; }));
  const parAnnee = {}; vendus.forEach(e => { parAnnee[e.year] = (parAnnee[e.year]||0)+1; });

  // taux d'écoulement par collection
  const ecoul = {};
  collections.forEach(c => {
    const tot = entries.filter(e => e.collectionId === c.id).length;
    const v = entries.filter(e => e.collectionId === c.id && e.status === "v").length;
    if (tot) ecoul[c.name] = Math.round(v/tot*100);
  });

  const bientot = entries.filter(e => e.status === "r")
    .sort((a,b) => (a.reservedUntil || Infinity) - (b.reservedUntil || Infinity));

  const dispo = mine.filter(e => e.status === "d" || e.status === "s").length;

  // --- valeur : ce que ça rapporte ---
  const prixDe = e => {
    const c = collections.find(x => x.id === e.collectionId);
    return (c && c.prix != null) ? Number(c.prix) : null;
  };
  const vendusValo = vendus.map(prixDe).filter(v => v != null);
  const ca = vendusValo.reduce((a,b) => a+b, 0);
  const prixMoyen = vendusValo.length ? (ca / vendusValo.length) : 0;
  const stockValo = mine.filter(e => e.status === "d" || e.status === "s")
    .map(prixDe).filter(v => v != null);
  const valeurStock = stockValo.reduce((a,b) => a+b, 0);

  // --- taux de vente par thème : ce qui part vraiment ---
  const totTag = {}, vendTag = {};
  mine.forEach(e => (e.tags||[]).forEach(t => {
    totTag[t] = (totTag[t]||0)+1;
    if (e.status === "v") vendTag[t] = (vendTag[t]||0)+1;
  }));
  const tauxTag = Object.keys(totTag)
    .filter(t => totTag[t] >= 5)
    .map(t => ({ t: t, pc: Math.round((vendTag[t]||0)/totTag[t]*100), n: vendTag[t]||0, tot: totTag[t] }))
    .sort((a,b) => b.pc - a.pc || b.n - a.n)
    .slice(0, 8);

  zone.innerHTML = `
    <div class="jr-stats-panel">
      <div class="jr-kpi">
        <div><b>${mine.length}</b><span>en base</span></div>
        <div><b>${dispo}</b><span>à vendre</span></div>
        <div><b>${vendus.length}</b><span>vendus</span></div>
        <div><b>${bientot.length}</b><span>réservés</span></div>
      </div>

      <h3>Argent</h3>
      <p class="jr-stat-sub">Estimation basse : tout est valorisé au prix de base de la collection, y compris les numéros spéciaux qui se vendent en réalité plus cher.</p>
      <div class="jr-kpi jr-kpi-clair">
        <div><b>${ca} €</b><span>encaissé</span></div>
        <div><b>${prixMoyen.toFixed(2)} €</b><span>panier moyen</span></div>
        <div><b>${valeurStock} €</b><span>stock restant</span></div>
        <div><b>${vendusValo.length}/${vendus.length}</b><span>ventes chiffrées</span></div>
      </div>
      ${vendusValo.length < vendus.length ? `<p class="jr-stat-note">Seules les collections dont le prix de base est renseigné sont chiffrées. Utilise le bouton ⚙ sur chaque onglet de collection pour le saisir.</p>` : ""}

      <h3>Ventes par mois</h3>
      ${dates.length ? `<div class="jr-mois">${moisCles.map(m => {
        const v = parMois[m.k] || 0;
        return `<div class="jr-mois-col" title="${v} vente${v>1?"s":""}">
          <span class="jr-mois-bar" style="height:${Math.round(v/maxMois*54)+2}px"></span>
          <span class="jr-mois-v">${v||""}</span>
          <span class="jr-mois-l">${m.lbl}</span>
        </div>`;
      }).join("")}</div>` : `<p class="jr-stat-vide">Les ventes seront datées à partir de maintenant.</p>`}
      ${sansDate ? `<p class="jr-stat-note">${sansDate} ventes antérieures ne sont pas datées : elles comptent dans les totaux mais pas dans ce graphique.</p>` : ""}

      <h3>Thèmes qui partent le mieux</h3>
      <p class="jr-stat-sub">Part du stock déjà vendue pour chaque thème. C'est l'indicateur à regarder avant de racheter un lot : un thème à fort pourcentage se vend vite, même s'il représente peu de ventes en volume.</p>
      ${tauxTag.length ? tauxTag.map(x => `<div class="jr-bar-l">
        <span class="jr-bar-n">${escapeHtml(x.t)}</span>
        <span class="jr-bar-t"><span class="jr-bar-f jr-bar-vert" style="width:${x.pc}%"></span></span>
        <span class="jr-bar-v">${x.pc}% <em>${x.n}/${x.tot}</em></span>
      </div>`).join("") : `<p class="jr-stat-vide">Pas encore assez de données.</p>`}

      <h3>Volumes vendus</h3>
      <h4>Par thème</h4>
      ${barres(parTag, 8)}
      <h4>Par année de parution</h4>
      ${barres(parAnnee, 6)}
      <h4>Par collection</h4>
      ${barres(parColl, 6)}

      <h3>Taux d'écoulement par collection</h3>
      ${Object.entries(ecoul).map(([n,pc]) => `<div class="jr-bar-l">
        <span class="jr-bar-n">${escapeHtml(n)}</span>
        <span class="jr-bar-t"><span class="jr-bar-f" style="width:${pc}%"></span></span>
        <span class="jr-bar-v">${pc}%</span>
      </div>`).join("") || `<p class="jr-stat-vide">Aucune donnée.</p>`}

      <h3>Réservations en cours</h3>
      ${bientot.length ? bientot.map(e => {
        const j = e.reservedUntil ? daysLeft(e.reservedUntil) : null;
        return `<div class="jr-resa ${j !== null && j<=0 ? "jr-resa-exp" : ""}">
          <span>${e.day} ${MOIS[e.month-1]} ${e.year} <em>${escapeHtml(collName(e.collectionId))}</em></span>
          <span>${j === null ? "sans limite" : (j > 0 ? j + " j" : "expirée")}</span>
        </div>`;
      }).join("") : `<p class="jr-stat-vide">Aucune réservation en cours.</p>`}
    </div>`;
}

function renderStatsPanelEnd() {}

function provCouleur(nom) {
  const liste = [...new Set(cartes.map(c => c.provenance || "Sans provenance"))].sort();

// ---------- Cartes : accès aux données ----------
function carteFromRow(r) {
  return { id: r.id, num: r.num, nom: r.nom || "", provenance: r.provenance || "",
    echelle: r.echelle || "", sujet: r.sujet || "", annee: r.annee || null,
    etatTxt: r.etat_txt || "", etatNote: r.etat_note || null, statut: r.statut || (r.vendu ? "v" : "d"),
    achat: r.achat == null ? null : Number(r.achat),
    valeur: r.valeur == null ? null : Number(r.valeur),
    cote: r.cote || "", vendu: !!r.vendu, venduLe: r.vendu_le ? new Date(r.vendu_le).getTime() : null,
    destination: r.destination || "", pays: r.pays || [], note: r.note || "", photo: r.photo || null,
    ajouteLe: r.ajoute_le ? new Date(r.ajoute_le).getTime() : null };
}
function carteToRow(c) {
  return { id: c.id, num: c.num, nom: c.nom, provenance: c.provenance || null,
    echelle: c.echelle || null, sujet: c.sujet || null, annee: c.annee || null,
    etat_txt: c.etatTxt || null, etat_note: c.etatNote || null, statut: c.statut || "d",
    achat: c.achat, valeur: c.valeur, cote: c.cote || null, vendu: c.statut === "v",
    vendu_le: c.venduLe ? new Date(c.venduLe).toISOString() : null,
    destination: c.destination || null, pays: c.pays || [], note: c.note || null, photo: c.photo || null,
    ajoute_le: c.ajouteLe ? new Date(c.ajouteLe).toISOString() : null };
}
function seedCartes() {
  return SEED_CARTES.map(a => ({
    id: "c" + a[0], num: a[0], nom: a[1] || "", provenance: a[2] || "", echelle: a[3] || "",
    sujet: a[4] || "", annee: a[5] || null, etatTxt: a[6] || "", etatNote: a[7] || null,
    achat: a[8] || null, valeur: a[9] || null, cote: a[10] || "",
    statut: a[11] ? "v" : (String(a[10]||"").toUpperCase().indexOf("S") === 0 || (a[12]||"").indexOf("International") >= 0 ? "s" : "d"),
    venduLe: null, destination: "", pays: a[12] ? a[12].split("|") : [], note: "", photo: null,
    ajouteLe: null, reservedUntil: null
  }));
}
async function chargerCartes() {
  if (cartesChargees) return;
  chargerProvSup();
  try {
    const rows = await rest("cartes?select=*&order=num.asc&limit=5000");
    if (rows && rows.length) { cartes = rows.map(carteFromRow); cartesChargees = true; sauverCartesLocal(); return; }
    cartes = seedCartes();
  } catch (e) {
    try {
      const raw = window.localStorage.getItem(CARTES_KEY);
      cartes = raw ? JSON.parse(raw) : seedCartes();
    } catch (e2) { cartes = seedCartes(); }
  }
  cartesChargees = true;
}
function sauverCartesLocal() {
  try { window.localStorage.setItem(CARTES_KEY, JSON.stringify(cartes)); } catch (e) {}
}
async function persistCarte(c) {
  if (cloudOk && isAdmin) {
    try {
      await rest("cartes", { method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([carteToRow(c)]) });
    } catch (err) { showStorageWarning("Enregistrement impossible : " + err.message); }
  }
  sauverCartesLocal();
}
async function pushCartes() {
  const rows = cartes.map(carteToRow);
  for (let i = 0; i < rows.length; i += 150) {
    await rest("cartes", { method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows.slice(i, i + 150)) });
  }
}

// ---------- Cartes : filtrage ----------
function cartesFiltrees() {
  const q = normalize(cRecherche.trim());
  return cartes.filter(c => {
    if (cFiltres.size && !cFiltres.has(c.statut || "d")) return false;
    if (cEtatMin && (!c.etatNote || c.etatNote < cEtatMin)) return false;
    if (cAnnee) { const k = c.annee || "Sans date"; if (String(k) !== cAnnee) return false; }
    if (cPublic.size && !(c.pays || []).some(p => cPublic.has(p))) return false;
    if (cProvSel && (c.provenance || "Sans provenance") !== cProvSel) return false;
    if (q) {
      const foin = normalize([c.nom, c.provenance, c.sujet, c.echelle, c.annee, c.cote, (c.pays||[]).join(" ")].join(" "));
      if (!foin.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (cTriChamp === "etat") return (b.etatNote||0) - (a.etatNote||0) || a.num - b.num;
    if (cTriChamp === "valeur") return (b.valeur||0) - (a.valeur||0) || a.num - b.num;
    if (cTriChamp === "annee") return (a.annee||9999) - (b.annee||9999) || a.num - b.num;
    return a.num - b.num;
  });
}

function couleurEtat(n) {
  if (!n) return { bg: "#ece6d8", fg: "#8a8070" };
  if (n >= 9) return { bg: "#1f5417", fg: "#fff" };
  if (n >= 8) return { bg: "#3a7d2a", fg: "#fff" };
  if (n >= 6) return { bg: "#8dc077", fg: "#122c0d" };
  if (n >= 5) return { bg: "#e8d08a", fg: "#5a4108" };
  return { bg: "#d9a5a5", fg: "#5a1a1a" };
}

    </div>

    <div class="jr-count">${cVue==='stats' ? "" : `${liste.length} carte${liste.length!==1?'s':''}${isAdmin ? ` · ${coutStock.toFixed(2)} € d'achat · ${valStock} € estimés` : ""}`}</div>
    ${isAdmin && cVue !== "stats" ? `<button class="jr-addbtn" id="cAddCarte">+ Ajouter une carte${cProvSel ? " dans « " + escapeHtml(cProvSel) + " »" : ""}</button>` : ""}
    <div id="cListe">${
      cVue === "stats" ? statsCartes()
      : cVue === "photos"
        ? `<div class="jr-vignes">${liste.map(c => vignetteCarte(c) +
            (cDetailId === c.id ? `<div class="jr-vign-fiche">${ficheCarte(c)}</div>` : "")).join("")}</div>`
      : cVue === "annees" ? vueAnnees(liste)
      : cVue === "pays" ? vuePays(liste)
        : (liste.map(c => cDetailId === c.id ? ficheCarte(c) : ligneCarte(c)).join("") || `<div class="jr-empty">Aucune carte ne correspond.</div>`)
    }</div>`;

  brancherCartes();
  renderPanier();
}

function vueAnnees(liste) {
  const parAn = {};
  liste.forEach(c => { const k = c.annee || "Sans date"; parAn[k] = (parAn[k]||0)+1; });
  const cles = Object.keys(parAn).sort((a,b) => a === "Sans date" ? 1 : b === "Sans date" ? -1 : a - b);
  if (!cles.length) return `<div class="jr-empty">Aucune carte.</div>`;
  const max = Math.max(...Object.values(parAn));
  const fiche = cDetailId ? cartes.find(x => x.id === cDetailId) : null;
  return `<p class="jr-dates-intro">Cliquez sur une année pour voir les cartes correspondantes.</p>
    <div class="jr-annees">${cles.map(k => {
      const n = parAn[k];
      const force = 0.35 + 0.65 * (n / max);
      return `<button class="jr-anbloc" data-canne="${k}" style="background:rgba(47,72,88,${force.toFixed(2)});color:#fff">
        <span class="jr-an-n">${k}</span><span class="jr-an-c">${n}</span></button>`;
    }).join("")}</div>
    ${fiche ? ficheCarte(fiche) : ""}`;
}

function vuePays(liste) {
  const parPays = {};
  liste.forEach(c => (c.pays||[]).forEach(p => { parPays[p] = (parPays[p]||0)+1; }));
  const sans = liste.filter(c => !(c.pays||[]).length).length;
  const cles = Object.keys(parPays).sort((a,b) => parPays[b]-parPays[a] || a.localeCompare(b));
  if (!cles.length) return `<div class="jr-empty">Aucun pays renseigné.</div>`;
  const max = Math.max(...Object.values(parPays));
  const fiche = cDetailId ? cartes.find(x => x.id === cDetailId) : null;
  return `<p class="jr-dates-intro">Cliquez sur un pays pour voir les cartes qui le représentent. Une carte qui couvre plusieurs pays apparaît dans chacun d'eux.</p>
    <div class="jr-annees">${cles.map(p => {
      const n = parPays[p];
      const force = 0.35 + 0.65 * (n / max);
      return `<button class="jr-anbloc jr-paysbloc" data-pays="${escapeHtml(p)}" style="background:rgba(47,72,88,${force.toFixed(2)});color:#fff">
        <span class="jr-an-n">${escapeHtml(p)}</span><span class="jr-an-c">${n}</span></button>`;
    }).join("")}</div>
    ${sans ? `<p class="jr-stat-note">${sans} carte${sans>1?"s":""} sans pays renseigné, invisible${sans>1?"s":""} dans cette vue.</p>` : ""}
    ${fiche ? ficheCarte(fiche) : ""}`;
}

function statsCartes() {
  const tous = cartes;
  const dispo = tous.filter(c => c.statut === "d" || c.statut === "s");
  const somme = (arr, f) => arr.reduce((s,x) => s + (f(x)||0), 0);
  const investi = somme(tous, c => c.achat);
  const avecPrix = tous.filter(c => c.achat != null);
  const moyen = avecPrix.length ? investi / avecPrix.length : 0;

  const barres = (obj, n) => {
    const arr = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, n||10);
    if (!arr.length) return `<p class="jr-stat-vide">Aucune donnée.</p>`;
    const max = arr[0][1];
    return arr.map(([k,v]) => `<div class="jr-bar-l">
      <span class="jr-bar-n">${escapeHtml(k)}</span>
      <span class="jr-bar-t"><span class="jr-bar-f" style="width:${Math.round(v/max*100)}%"></span></span>
      <span class="jr-bar-v">${v}</span></div>`).join("");
  };

  // évolution du coût moyen d'achat, par mois d'entrée en stock
  const parMois = {};
  avecPrix.forEach(c => {
    const k = c.ajouteLe ? new Date(c.ajouteLe).toISOString().slice(0,7) : "avant le suivi";
    (parMois[k] = parMois[k] || []).push(c.achat);
  });
  const moisTries = Object.keys(parMois).sort((a,b) => a === "avant le suivi" ? -1 : b === "avant le suivi" ? 1 : a.localeCompare(b));
  const moyennes = moisTries.map(k => ({ k: k, n: parMois[k].length,
    m: parMois[k].reduce((s,x)=>s+x,0) / parMois[k].length }));
  const maxM = Math.max(0.01, ...moyennes.map(x => x.m));
  const nomMois = k => {
    if (k === "avant le suivi") return "avant";
    const [a,m] = k.split("-");
    return MOIS[parseInt(m,10)-1].slice(0,4) + " " + a.slice(2);
  };

  const parPays = {}; dispo.forEach(c => (c.pays||[]).forEach(p => { parPays[p] = (parPays[p]||0)+1; }));
  const parProv = {}; dispo.forEach(c => { const k = c.provenance || "Sans provenance"; parProv[k] = (parProv[k]||0)+1; });
  const parEtat = {}; dispo.forEach(c => { const k = c.etatNote ? c.etatNote + "/10" : "non noté"; parEtat[k] = (parEtat[k]||0)+1; });

  const sansPays = dispo.filter(c => !(c.pays||[]).length).length;
  const sansPhoto = dispo.filter(c => !c.photo).length;
  const sansEtat = dispo.filter(c => !c.etatNote).length;
  const pc = n => Math.round(n / Math.max(1, dispo.length) * 100);

  return `<div class="jr-stats-panel">
    <div class="jr-kpi">
      <div><b>${tous.length}</b><span>en base</span></div>
      <div><b>${dispo.length}</b><span>disponibles</span></div>
      <div><b>${tous.filter(c=>c.statut==="v").length}</b><span>vendues</span></div>
      <div><b>${tous.filter(c=>c.statut==="r").length}</b><span>réservées</span></div>
    </div>

    <h3>Argent</h3>
    <div class="jr-kpi jr-kpi-clair">
      <div><b>${investi.toFixed(2)} €</b><span>investi au total</span></div>
      <div><b>${somme(dispo, c => c.achat).toFixed(2)} €</b><span>coût du stock restant</span></div>
      <div><b>${somme(dispo, c => c.valeur)} €</b><span>valeur théorique</span></div>
      <div><b>${moyen.toFixed(2)} €</b><span>coût moyen / carte</span></div>
    </div>

    <h3>Évolution du coût moyen d'achat</h3>
    <p class="jr-stat-sub">Par mois d'entrée en stock. Sert à savoir si tes lots reviennent plus ou moins cher qu'avant, et à chiffrer une boîte mystère.</p>
    ${moyennes.length ? `<div class="jr-mois">${moyennes.map(x => `
      <div class="jr-mois-col" title="${x.n} cartes à ${x.m.toFixed(2)} € en moyenne">
        <span class="jr-mois-bar" style="height:${Math.round(x.m/maxM*54)+2}px"></span>
        <span class="jr-mois-v">${x.m.toFixed(1)}</span>
        <span class="jr-mois-l">${nomMois(x.k)}</span>
      </div>`).join("")}</div>` : `<p class="jr-stat-vide">Aucune donnée.</p>`}
    ${parMois["avant le suivi"] ? `<p class="jr-stat-note">${parMois["avant le suivi"].length} cartes importées de ton tableau n'ont pas de date d'entrée : elles sont regroupées sous « avant ». Les cartes que tu ajoutes maintenant seront datées automatiquement.</p>` : ""}

    <h3>Ce que j'ai pour chaque pays</h3>
    <p class="jr-stat-sub">Sur le stock disponible. Le tableau à ouvrir avant de composer une boîte pour un client étranger.</p>
    ${barres(parPays, 12)}

    <h3>Par collection</h3>
    ${barres(parProv, 8)}

    <h3>État du stock disponible</h3>
    ${barres(parEtat, 10)}

    <h3>À compléter</h3>
    <div class="jr-bar-l"><span class="jr-bar-n">Sans pays</span><span class="jr-bar-t"><span class="jr-bar-f" style="width:${pc(sansPays)}%"></span></span><span class="jr-bar-v">${sansPays}</span></div>
    <div class="jr-bar-l"><span class="jr-bar-n">Sans photo</span><span class="jr-bar-t"><span class="jr-bar-f" style="width:${pc(sansPhoto)}%"></span></span><span class="jr-bar-v">${sansPhoto}</span></div>
    <div class="jr-bar-l"><span class="jr-bar-n">Sans note d'état</span><span class="jr-bar-t"><span class="jr-bar-f" style="width:${pc(sansEtat)}%"></span></span><span class="jr-bar-v">${sansEtat}</span></div>
  </div>`;
}

function ligneCarte(c) {
  const st = c.statut || "d";
  const LBL = { d:"Disponible", s:"Spéciale", v:"Vendue", r:"Réservée" };
  const pc = provCouleur(c.provenance);
  const e = couleurEtat(c.etatNote);
  const bas = [c.echelle, c.sujet].filter(Boolean);
  return `<div class="jr-row" data-cid="${c.id}">
    <div class="jr-row-top">
      <div class="jr-row-open jr-row-datewrap" data-copen="${c.id}">
        <span class="jr-cnom">${escapeHtml(c.nom)}</span>
        ${c.annee ? `<span class="jr-row-year">${c.annee}</span>` : ""}
      </div>
      ${isAdmin
        ? `<button class="jr-badge jr-badge-${st} jr-badge-btn" data-cstatline="${c.id}">${LBL[st]}</button>`
        : `<span class="jr-badge jr-badge-${st}">${LBL[st]}</span>`}
      <span class="jr-colchip" style="background:${pc.bg};color:${pc.fg}">${escapeHtml(c.provenance || "Sans provenance")}</span>
      ${isAdmin && c.etatNote ? `<span class="jr-cetat" style="background:${e.bg};color:${e.fg}">${c.etatNote}/10</span>` : ""}
      <div class="jr-row-act">
        ${(!isAdmin && (st === "d" || st === "s"))
          ? `<button class="jr-add-panier ${dansPanier("c:"+c.id)?"on":""}" data-panier="c:${c.id}" aria-label="Ajouter à ma sélection">${dansPanier("c:"+c.id)?"✓":"+"}</button>` : ""}
      </div>
    </div>
    ${(bas.length || (c.pays||[]).length) ? `<div class="jr-row-open jr-row-bas" data-copen="${c.id}">
      ${bas.map(x => `<span class="jr-cinfo">${escapeHtml(x)}</span>`).join("")}
      ${(c.pays||[]).slice(0,4).map(p => `<span class="jr-rowtag">${escapeHtml(p)}</span>`).join("")}
      ${(c.pays||[]).length > 4 ? `<span class="jr-rowtag jr-rowtag-plus">+${c.pays.length-4}</span>` : ""}
      ${isAdmin && !(c.pays||[]).length ? `<span class="jr-capreciser">pays à préciser</span>` : ""}
    </div>` : ""}
  </div>`;
}

function vignetteCarte(c) {
  const st = c.statut || "d";
  const LBL = { d:"Disponible", s:"Spéciale", v:"Vendue", r:"Réservée" };
  return `<button class="jr-vign" data-copen="${c.id}">
    <span class="jr-vign-img">${c.photo
      ? `<img src="${photoUrl(c.photo)}" alt="${escapeHtml(c.nom)}" loading="lazy">`
      : `<span class="jr-vign-vide">pas de photo</span>`}</span>
    <span class="jr-vign-nom">${escapeHtml(c.nom)}</span>
    <span class="jr-vign-bas">
      <span class="jr-badge jr-badge-${st}">${LBL[st]}</span>
      ${c.annee ? `<span class="jr-cinfo">${c.annee}</span>` : ""}
    </span>
  </button>`;
}

function ficheCarte(c) {
  const e = couleurEtat(c.etatNote);
  const st = c.statut || "d";
  const LBL = { d:"Disponible", s:"Spéciale", v:"Vendue", r:"Réservée" };
  const photo = c.photo ? `<img class="jr-photo" src="${photoUrl(c.photo)}" alt="Carte ${escapeHtml(c.nom)}" loading="lazy">` : "";

  if (!isAdmin) {
    return `<div class="jr-detail" id="cDetail">
      <div class="jr-detail-head">
        <div>
          <div class="jr-detail-date">${escapeHtml(c.nom)}${c.annee ? ` <span class="jr-row-year">${c.annee}</span>` : ""}</div>
          <div class="jr-detail-coll">${[c.provenance, c.echelle, c.sujet].filter(Boolean).map(escapeHtml).join(" · ") || "—"}</div>
        </div>
        <button id="cClose" aria-label="Fermer">✕</button>
      </div>
      ${photo}
      <div class="jr-cfiche-etat">
        <span class="jr-badge jr-badge-${st}">${LBL[st]}</span>
      </div>
      ${(c.pays||[]).length ? `<label class="jr-lbl">Pays représentés</label>
        <div class="jr-tagwrap">${c.pays.map(p => `<span class="jr-tagpill">${escapeHtml(p)}</span>`).join("")}</div>` : ""}
      ${(st === "d" || st === "s")
        ? `<button class="jr-detail-panier ${dansPanier("c:"+c.id)?"on":""}" id="cPanierBtn">${dansPanier("c:"+c.id)?"✓ Dans ma sélection":"+ Ajouter à ma sélection"}</button>` : ""}
    </div>`;
  }

  const provs = [...new Set(cartes.map(x => x.provenance).filter(Boolean).concat(provenancesSup))].sort();
  const marge = (c.valeur != null && c.achat != null) ? (c.valeur - c.achat).toFixed(2) : "—";

  return `<div class="jr-detail" id="cDetail">
    <div class="jr-detail-head">
      <div><div class="jr-detail-date">Fiche n°${c.num || "—"}</div></div>
      <button id="cClose" aria-label="Fermer">✕</button>
    </div>

    ${photo}
    <div class="jr-photo-actions">
      <label class="jr-photo-btn">${c.photo ? "Remplacer la photo" : "Ajouter une photo"}
        <input type="file" id="cPhotoInput" accept="image/*" style="display:none"></label>
      ${c.photo ? `<button class="jr-photo-del" id="cPhotoDel">Retirer</button>` : ""}
    </div>
    <p class="jr-photo-msg" id="cPhotoMsg"></p>

    <label class="jr-lbl">Statut</label>
    <div class="jr-statuspick">
      ${["d","s","v","r"].map(k => `<button class="jr-badge jr-badge-${k} ${st===k?'cur':''}" data-cstat="${k}">${LBL[k]}</button>`).join("")}
    </div>

    <div class="jr-form jr-form-carte">
      <div class="jr-champ jr-champ-large"><label for="cfNom">Nom de la carte</label>
        <input type="text" id="cfNom" value="${escapeHtml(c.nom)}"></div>
      <div class="jr-champ"><label for="cfAnnee">Année</label>
        <input type="number" id="cfAnnee" inputmode="numeric" value="${c.annee || ""}" placeholder="1913"></div>
      <div class="jr-champ"><label for="cfEchelle">Échelle</label>
        <input type="text" id="cfEchelle" value="${escapeHtml(c.echelle)}" placeholder="1/50 000"></div>
      <div class="jr-champ"><label for="cfSujet">Sujet</label>
        <input type="text" id="cfSujet" value="${escapeHtml(c.sujet)}" placeholder="Ville, Région…"></div>
      <div class="jr-champ jr-champ-large"><label for="cfProv">Collection / provenance</label>
        <select id="cfProv">
          <option value="">— aucune —</option>
          ${provs.map(pv => `<option value="${escapeHtml(pv)}"${c.provenance===pv?' selected':''}>${escapeHtml(pv)}</option>`).join("")}
        </select></div>
      <div class="jr-champ"><label for="cfEtat">État sur 10</label>
        <input type="number" id="cfEtat" min="1" max="10" value="${c.etatNote || ""}"></div>
      <div class="jr-champ"><label for="cfAchat">Prix d'achat €</label>
        <input type="number" id="cfAchat" step="0.01" value="${c.achat != null ? c.achat : ""}"></div>
      <div class="jr-champ"><label for="cfValeur">Valeur estimée €</label>
        <input type="number" id="cfValeur" step="1" value="${c.valeur != null ? c.valeur : ""}"></div>
      <div class="jr-champ jr-champ-large"><label for="cfEtatTxt">Description de l'état</label>
        <input type="text" id="cfEtatTxt" value="${escapeHtml(c.etatTxt)}" placeholder="bord abîmé, plié…"></div>
    </div>
    <div class="jr-cargent">
      <div><b>${c.achat != null ? c.achat.toFixed(2) + " €" : "—"}</b><span>achat</span></div>
      <div><b>${c.valeur != null ? c.valeur + " €" : "—"}</b><span>valeur</span></div>
      <div><b id="cMarge">${marge === "—" ? "—" : marge + " €"}</b><span>marge</span></div>
    </div>

    <label class="jr-lbl">Pays représentés</label>
    <div class="jr-tagwrap">
      ${(c.pays||[]).map((p,i) => `<span class="jr-tagpill">${escapeHtml(p)}<button data-crm="${i}" aria-label="Retirer">×</button></span>`).join("") || `<span class="jr-notags">Aucun pays</span>`}
    </div>
    <div class="jr-tagadd">
      <input type="text" id="cNewPays" autocomplete="off" placeholder="Ajouter un pays ou « International »">
      <button id="cAddPays" class="jr-btn">Ajouter</button>
    </div>
    <div class="jr-sugg" id="cSuggPays"></div>

    <label class="jr-lbl">Note personnelle</label>
    <textarea id="cNote" rows="2" placeholder="Remarques, provenance du lot…">${escapeHtml(c.note)}</textarea>

    <button class="jr-detail-save" id="cSave">Enregistrer</button>
    <button class="jr-detail-del" id="cDel">Supprimer cette carte</button>
    <div id="cDelConfirm"></div>
  </div>`;
}

function brancherCartes() {
  const maj = () => { renderCartes(); };
  const el = id => document.getElementById(id);

  const s = el("cSearch");
  if (s) s.addEventListener("input", ev => { cRecherche = ev.target.value; renderCartes(); el("cSearch").focus(); });
  if (el("cClear")) el("cClear").addEventListener("click", () => { cRecherche = ""; maj(); });
  if (el("cEtat")) el("cEtat").addEventListener("change", ev => { cEtatMin = parseInt(ev.target.value,10); maj(); });
  if (el("cTri")) el("cTri").addEventListener("change", ev => { cTriChamp = ev.target.value; maj(); });
  if (el("cAnClear")) el("cAnClear").addEventListener("click", () => { cAnnee = ""; maj(); });
  if (el("cPubClear")) el("cPubClear").addEventListener("click", () => { cPublic.clear(); maj(); });


  document.querySelectorAll("[data-pays]").forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.pays;
    if (cVue === "pays") { cPublic.clear(); cPublic.add(p); cVue = "liste"; cDetailId = null; }
    else { cPublic.has(p) ? cPublic.delete(p) : cPublic.add(p); }
    maj();
  }));
  document.querySelectorAll("[data-cprov]").forEach(b => b.addEventListener("click", () => {
    cProvSel = b.dataset.cprov; cDetailId = null; cPublic.clear(); maj();
  }));
  if (el("cProvNew")) el("cProvNew").addEventListener("click", () => {
    const f = el("cNewProvForm"); f.style.display = "flex"; el("cNewProvInput").focus();
  });
  if (el("cNewProvCancel")) el("cNewProvCancel").addEventListener("click", () => { el("cNewProvForm").style.display = "none"; });
  if (el("cNewProvSave")) el("cNewProvSave").addEventListener("click", () => {
    const v = (el("cNewProvInput").value||"").trim();
    if (!v) return;
    if (!provenancesSup.includes(v)) provenancesSup.push(v);
    sauverProvSup(); cProvSel = v; maj();
  });
  if (el("cAddCarte")) el("cAddCarte").addEventListener("click", async () => {
    const maxNum = cartes.reduce((m,x) => Math.max(m, x.num||0), 0);
    const nouvelle = { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      num: maxNum + 1, nom: "Nouvelle carte", provenance: cProvSel === "Sans provenance" ? "" : cProvSel,
      echelle: "", sujet: "", annee: null, etatTxt: "", etatNote: null, statut: "d",
      achat: null, valeur: null, cote: "", venduLe: null, destination: "",
      pays: [], note: "", photo: null, ajouteLe: Date.now() };
    cartes.push(nouvelle);
    await persistCarte(nouvelle);
    cVue = "liste"; cFiltres = new Set(["d","s"]); cDetailId = nouvelle.id; maj();
  });
  document.querySelectorAll("[data-cvue]").forEach(b => b.addEventListener("click", () => {
    cVue = b.dataset.cvue; cDetailId = null; cAnnee = ""; maj();
  }));
  document.querySelectorAll("[data-canne]").forEach(b => b.addEventListener("click", () => {
    cAnnee = b.dataset.canne; cVue = "liste"; cDetailId = null; maj();
  }));
  document.querySelectorAll("[data-cstatline]").forEach(b => b.addEventListener("click", () => {
    cDetailId = b.dataset.cstatline; maj();
  }));
  document.querySelectorAll("[data-cfilt]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.cfilt; cFiltres.has(k) ? cFiltres.delete(k) : cFiltres.add(k); maj();
  }));
  if (el("cProvMore")) el("cProvMore").addEventListener("click", () => { cProvOuvert = true; maj(); });
  if (el("cProvLess")) el("cProvLess").addEventListener("click", () => { cProvOuvert = false; maj(); });
  document.querySelectorAll("[data-copen]").forEach(b => b.addEventListener("click", () => {
    cDetailId = (cDetailId === b.dataset.copen) ? null : b.dataset.copen; maj();
  }));
  if (el("cClose")) el("cClose").addEventListener("click", () => { cDetailId = null; maj(); });

  document.querySelectorAll("[data-panier]").forEach(b => b.addEventListener("click", () => {
    basculerPanier(b.dataset.panier); maj();
  }));
  const c = cartes.find(x => x.id === cDetailId);
  if (c) {
    const bp = document.getElementById("cPanierBtn");
    if (bp) bp.addEventListener("click", () => { basculerPanier("c:" + c.id); maj(); });
  }
  if (!c || !isAdmin) return;

  document.querySelectorAll("[data-crm]").forEach(b => b.addEventListener("click", async () => {
    c.pays.splice(parseInt(b.dataset.crm,10), 1); await persistCarte(c); maj();
  }));
  const ajouterPays = async () => {
    const inp = el("cNewPays"); const v = (inp.value||"").trim();
    if (!v) return;
    if (!c.pays.includes(v)) c.pays.push(v);
    await persistCarte(c); maj();
  };
  if (el("cAddPays")) el("cAddPays").addEventListener("click", ajouterPays);
  if (el("cNewPays")) el("cNewPays").addEventListener("keydown", ev => { if (ev.key === "Enter") ajouterPays(); });
  document.querySelectorAll("[data-cstat]").forEach(b => b.addEventListener("click", async () => {
    const k = b.dataset.cstat;
    c.statut = k;
    c.venduLe = (k === "v") ? (c.venduLe || Date.now()) : null;
    await persistCarte(c); maj();
  }));
  const pin = document.getElementById("cPhotoInput");
  if (pin) pin.addEventListener("change", async () => {
    const f = pin.files && pin.files[0];
    if (!f) return;
    const msg = document.getElementById("cPhotoMsg");
    msg.style.color = "#8a8070"; msg.textContent = "Compression et envoi…";
    try {
      const blob = await compresserImage(f);
      const nom = "carte-" + c.id + "-" + Date.now() + ".jpg";
      const res = await fetch(SUPABASE_URL + "/storage/v1/object/photos/" + nom, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + bearer(), "Content-Type": "image/jpeg", "x-upsert": "true" },
        body: blob
      });
      if (!res.ok) throw new Error((await res.text()).slice(0,150));
      const anc = c.photo; c.photo = nom;
      await persistCarte(c);
      if (anc) { try { await supprimerFichier(anc); } catch (e) {} }
      maj();
    } catch (err) { msg.style.color = "#a33"; msg.textContent = "✕ " + err.message; }
  });
  const pdel = document.getElementById("cPhotoDel");
  if (pdel) pdel.addEventListener("click", async () => {
    const anc = c.photo; c.photo = null; await persistCarte(c);
    if (anc) { try { await supprimerFichier(anc); } catch (e) {} }
    maj();
  });
  const bdel = document.getElementById("cDel");
  if (bdel) bdel.addEventListener("click", () => {
    const z = document.getElementById("cDelConfirm");
    z.innerHTML = `<div class="jr-delconf">Supprimer définitivement cette carte ?
      <button id="cDelYes">Oui, supprimer</button><button id="cDelNo">Annuler</button></div>`;
    document.getElementById("cDelNo").addEventListener("click", () => { z.innerHTML = ""; });
    document.getElementById("cDelYes").addEventListener("click", async () => {
      const id = c.id;
      cartes = cartes.filter(x => x.id !== id);
      cDetailId = null;
      if (cloudOk && isAdmin) { try { await rest("cartes?id=eq." + encodeURIComponent(id), { method: "DELETE" }); } catch (e) {} }
      sauverCartesLocal(); maj();
    });
  });
  document.querySelectorAll("[data-cdest]").forEach(b => b.addEventListener("click", async () => {
    c.destination = (c.destination === b.dataset.cdest) ? "" : b.dataset.cdest;
    await persistCarte(c); maj();
  }));
  const nb = (id) => { const v = (el(id).value||"").trim(); return v === "" ? null : Number(v); };
  ["cfAchat","cfValeur"].forEach(id => { const f = el(id); if (f) f.addEventListener("input", () => {
    const a = nb("cfAchat"), v = nb("cfValeur");
    el("cMarge").textContent = (a != null && v != null) ? (v - a).toFixed(2) + " €" : "—";
  }); });
  if (el("cSave")) el("cSave").addEventListener("click", async () => {
    c.nom = (el("cfNom").value||"").trim() || c.nom;
    c.annee = nb("cfAnnee");
    c.echelle = (el("cfEchelle").value||"").trim();
    c.sujet = (el("cfSujet").value||"").trim();
    c.provenance = el("cfProv").value;
    const n = nb("cfEtat"); c.etatNote = n ? Math.max(1, Math.min(10, Math.round(n))) : null;
    c.achat = nb("cfAchat"); c.valeur = nb("cfValeur");
    c.etatTxt = (el("cfEtatTxt").value||"").trim();
    c.note = el("cNote").value;
    await persistCarte(c); cDetailId = null; maj();
  });

  // suggestions de pays déjà utilisés
  const zs = el("cSuggPays");
  if (zs) {
    const tous = {};
    cartes.forEach(x => (x.pays||[]).forEach(p => { tous[p] = (tous[p]||0)+1; }));
    const dispo = Object.keys(tous).filter(p => !c.pays.includes(p)).sort((a,b) => tous[b]-tous[a]);
    zs.innerHTML = dispo.length ? `<span class="jr-sugg-lbl">Déjà utilisés</span>` +
      dispo.map(p => `<button class="jr-suggtag" data-csugg="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join("") : "";
    zs.querySelectorAll("[data-csugg]").forEach(b => b.addEventListener("click", async () => {
      if (!c.pays.includes(b.dataset.csugg)) c.pays.push(b.dataset.csugg);
      await persistCarte(c); maj();
    }));
  }
}

function collName(id) {
  const c = collections.find(x => x.id === id);
  return c ? c.name : "?";
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

      ${(e.status === "d" || e.status === "s")

function majFiche() { renderView(); brancherFiche(); }

function brancherFiche() {
  const e = entries.find(x => x.id === detailId);
  const zone = document.getElementById("jrDetail");
  if (!e || !zone) return;

  const close = document.getElementById("jrDetailClose");
  if (close) close.addEventListener("click", () => { detailId = null; render(); });

  const bp = document.getElementById("jrDetailPanier");
  if (bp) bp.addEventListener("click", () => {
    basculerPanier(e.id);
    renderPanier(); majFiche();
  });
  if (!isAdmin) return;

  const bdel = document.getElementById("jrDetailDel");
  if (bdel) bdel.addEventListener("click", () => {
    const z = document.getElementById("jrDelConfirm");
    z.innerHTML = `<div class="jr-delconf">Supprimer définitivement ce journal ?
      <button id="jrDelYes">Oui, supprimer</button>
      <button id="jrDelNo">Annuler</button></div>`;
    document.getElementById("jrDelNo").addEventListener("click", () => { z.innerHTML = ""; });
    document.getElementById("jrDelYes").addEventListener("click", async () => {
      const id = e.id;
      entries = entries.filter(x => x.id !== id);
      detailId = null;
      await persistDelete(id);
      render();
    });
  });

  zone.querySelectorAll("[data-dset]").forEach(btn => {
    btn.addEventListener("click", async () => {
      setStatut(e, btn.dataset.dset, !!btn.dataset.dperm);
      await persistEntry(e);
      renderStats();
      majFiche();
    });
  });

  zone.querySelectorAll("[data-rm]").forEach(btn => {
    btn.addEventListener("click", async () => {
      e.tags.splice(parseInt(btn.dataset.rm,10), 1);
      await persistEntry(e);
      renderTagCloud();
      majFiche();
    });
  });

  function tousLesThemes() {
    const c = {};
    entries.forEach(x => (x.tags||[]).forEach(t => { c[t] = (c[t]||0)+1; }));
    return Object.keys(c).sort((a,b) => {
      if (estMaster(a) !== estMaster(b)) return estMaster(a) ? -1 : 1;
      return c[b]-c[a] || a.localeCompare(b);
    });
  }

  function renderSugg() {
    const z = document.getElementById("jrSugg");
    if (!z) return;
    const saisie = normalize((document.getElementById("jrNewTag") || {}).value || "");
    const dispo = tousLesThemes()
      .filter(t => !(e.tags||[]).includes(t))
      .filter(t => !saisie || normalize(libelleTag(t)).includes(saisie));
    if (!dispo.length) {
      z.innerHTML = saisie ? `<span class="jr-sugg-vide">Aucun thème existant — « Ajouter » créera un nouveau thème.</span>` : "";
      return;
    }
    z.innerHTML = `<span class="jr-sugg-lbl">Thèmes existants</span>`
      + dispo.slice(0, 40).map(t =>
          `<button class="jr-suggtag ${estMaster(t)?"jr-suggtag-master":""}" data-sugg="${escapeHtml(t)}">${escapeHtml(libelleTag(t))}</button>`
        ).join("")
      + (dispo.length > 40 ? `<span class="jr-sugg-vide">+${dispo.length-40} autres — tape pour filtrer</span>` : "");
    z.querySelectorAll("[data-sugg]").forEach(b => {
      b.addEventListener("click", async () => {
        e.tags = e.tags || [];
        if (!e.tags.includes(b.dataset.sugg)) e.tags.push(b.dataset.sugg);
        await persistEntry(e);
        renderTagCloud();
        majFiche();
      });
    });
  }
  renderSugg();
  const champTag = document.getElementById("jrNewTag");
  if (champTag) champTag.addEventListener("input", renderSugg);

  const addTag = async () => {
    const input = document.getElementById("jrNewTag");
    const val = input.value.trim();
    if (!val) return;
    if (!e.tags) e.tags = [];
    if (!e.tags.some(t => normalize(t) === normalize(val))) e.tags.push(val);
    input.value = "";
    await persistEntry(e);
    renderTagCloud();
    majFiche();
  };
  document.getElementById("jrAddTagBtn").addEventListener("click", addTag);
  document.getElementById("jrNewTag").addEventListener("keydown", ev => { if (ev.key === "Enter") addTag(); });

  const pin = document.getElementById("jrPhotoInput");
  if (pin) pin.addEventListener("change", async () => {
    const f = pin.files && pin.files[0];
    if (!f) return;
    const msg = document.getElementById("jrPhotoMsg");
    msg.style.color = "#8a8070";
    msg.textContent = "Compression et envoi…";
    try {
      const ko = await envoyerPhoto(e, f);
      msg.textContent = "✓ Photo enregistrée (" + ko + " Ko)";
      majFiche();
    } catch (err) {
      msg.style.color = "#a33";
      msg.textContent = "✕ " + err.message;
    }
  });
  const pdel = document.getElementById("jrPhotoDel");
  if (pdel) pdel.addEventListener("click", async () => {
    const anc = e.photo;
    e.photo = null;
    await persistEntry(e);
    if (anc) { try { await supprimerFichier(anc); } catch (err) {} }
    majFiche();
  });

  document.getElementById("jrDetailSave").addEventListener("click", async () => {
    const newTitle = document.getElementById("jrDetailTitle").value;
    if (newTitle !== e.title) e.guessed = false;
    e.title = newTitle;
    e.note = document.getElementById("jrDetailNote").value;
    await persistEntry(e);
    detailId = null;
    render();
  });
}

function estMaster(t) { return typeof t === "string" && t.charAt(0) === "#"; }
function libelleTag(t) { return estMaster(t) ? t.slice(1) : t; }

function renderTagCloud() {
  const zone = document.getElementById("jrTagCloud");
  const counts = {};
  entries.filter(inCollection).forEach(e => {
    (e.tags||[]).forEach(t => { counts[t] = (counts[t]||0) + 1; });
  });
  const sorted = Object.keys(counts).sort((a,b) => {
    if (estMaster(a) !== estMaster(b)) return estMaster(a) ? -1 : 1;
    return counts[b]-counts[a] || a.localeCompare(b);
  });
  if (sorted.length === 0) { zone.innerHTML = ""; return; }

  const n = selectedTags.size;
  const nbMaster = sorted.filter(estMaster).length;
  const label = n === 0 ? `Thèmes (${sorted.length})` : `Thèmes · ${n} sélectionné${n>1?'s':''}`;

  zone.innerHTML = `
    <button class="jr-tagtoggle ${n>0?'on':''}" id="jrTagToggle">
      <span>${label}</span><span class="jr-caret">${tagsOpen ? '▲' : '▼'}</span>
    </button>
    <div class="jr-tagmenu" style="display:${tagsOpen ? 'flex' : 'none'};">
      ${sorted.map((t,i) => {
        const sep = (i === nbMaster && nbMaster > 0) ? `<span class="jr-tagsep"></span>` : "";
        return sep + `<button class="jr-cloudtag ${estMaster(t) ? "jr-cloudtag-master" : ""} ${selectedTags.has(t)?'on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(libelleTag(t))} <span>${counts[t]}</span></button>`;
      }).join("")}
      ${n > 0 ? `<button class="jr-clearTags" id="jrClearTags">Tout désélectionner</button>` : ""}
    </div>`;

  document.getElementById("jrTagToggle").addEventListener("click", () => {
    tagsOpen = !tagsOpen;
    renderTagCloud();
  });
  zone.querySelectorAll(".jr-cloudtag").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.tag;
      if (selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
      renderTagCloud();
      renderView();
    });
  });
  const clear = document.getElementById("jrClearTags");
  if (clear) clear.addEventListener("click", () => {
    selectedTags.clear();
    renderTagCloud();
    renderView();
  });
}

document.getElementById("jrExportBtn").addEventListener("click", () => {
  const panel = document.getElementById("jrBackupPanel");
  const payload = JSON.stringify({ v: 4, collections: collections, entries: entries });
  panel.style.display = "block";
  panel.innerHTML = `
    <textarea id="jrBkText" readonly></textarea>
    <div class="jr-bk-actions"><button id="jrBkCopy">Copier la sauvegarde</button></div>
    <p class="jr-bk-msg" id="jrBkMsg">Copie ce texte et garde-le (mail, notes, fichier). Il contient toute ta collection.</p>`;
  const ta = document.getElementById("jrBkText");
  ta.value = payload;
  document.getElementById("jrBkCopy").addEventListener("click", async () => {
    const msg = document.getElementById("jrBkMsg");
    try {
      await navigator.clipboard.writeText(payload);
      msg.textContent = "✓ Sauvegarde copiée. Colle-la quelque part de sûr.";
    } catch (err) {
      ta.select();
      msg.textContent = "Sélectionne le texte ci-dessus et copie-le manuellement.";
    }
  });
});

    <p class="jr-bk-msg" id="jrBkMsg2">Attention : cela remplacera les données actuelles.</p>`;

      const data = JSON.parse(document.getElementById("jrBkImport").value.trim());
      if (!data || !Array.isArray(data.entries) || !Array.isArray(data.collections)) {

      }
      entries = data.entries;
      collections = data.collections;

        if (typeof e.note !== "string") e.note = "";

document.getElementById("jrCmdBtn").addEventListener("click", () => {
  const p = document.getElementById("jrCmdPanel");
